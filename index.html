<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aventura do Alfabeto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#062f4a;font-family:Arial,sans-serif;color:#17385f}button,input{font:inherit}.screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:12px}.screen.on{display:flex}.game{position:relative;width:min(1280px,100%);aspect-ratio:16/9;overflow:hidden;border-radius:24px;background:#0a5672;box-shadow:0 14px 45px #001b2d99}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}.shade{position:absolute;inset:0;background:linear-gradient(#0000 55%,#002c3a33);pointer-events:none}.brand{position:absolute;top:3%;left:50%;transform:translateX(-50%);width:60%;text-align:center}.brand h1{margin:0;color:#fff;font-size:clamp(30px,5.8vw,78px);line-height:.9;text-shadow:0 6px 0 #07345b,0 10px 20px #001b2d}.brand h1 span{color:#ffe039}.brand p{display:inline-block;margin:1.5% 0 0;background:#ffd883;border:4px solid #8b4c18;border-radius:18px;padding:.6% 3%;font-weight:900;font-size:clamp(12px,1.5vw,22px)}.setupCard{position:absolute;left:50%;top:32%;transform:translateX(-50%);width:68%;background:#ffffffed;border:6px solid #4bc7f4;border-radius:28px;padding:2%;box-shadow:0 10px 0 #087ca9}.label{text-align:center;font-weight:1000;font-size:clamp(15px,2vw,28px);margin-bottom:1%}.name{width:100%;height:clamp(48px,6vw,72px);border:3px solid #b9e9fb;border-radius:18px;outline:0;text-align:center;font-weight:900;font-size:clamp(17px,2vw,28px);color:#17385f}.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:2%;margin-top:2%}.avatar{position:relative;border:4px solid #a9e8f7;border-radius:20px;background:#dff8ff;cursor:pointer;aspect-ratio:1;overflow:hidden;padding:0}.avatar svg{width:100%;height:100%}.avatar.sel{border-color:#2fd05a;box-shadow:inset 0 0 0 5px #fff,0 0 0 5px #2fd05a}.avatar.sel:after{content:"✓";position:absolute;right:4%;top:4%;width:25%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#2fd05a;color:#fff;border:3px solid #fff;font-weight:1000}.start{display:block;margin:2% auto 0;width:52%;border:5px solid #fff;border-radius:40px;background:linear-gradient(#4ee21e,#16a800);color:#fff;padding:1.2%;font-size:clamp(20px,2.6vw,38px);font-weight:1000;cursor:pointer;box-shadow:0 7px 0 #087900}.notice{text-align:center;height:1.4em;color:#c53b2e;font-weight:900;margin-top:1%}.topbar{position:absolute;left:2%;right:2%;top:2%;display:flex;align-items:center;justify-content:space-between;z-index:5}.round,.pill{border:4px solid #fff;background:#f4a414;color:#fff;border-radius:18px;font-weight:1000;box-shadow:0 4px 0 #a85d08}.round{width:58px;height:58px;cursor:pointer;font-size:28px}.pill{padding:8px 15px}.mapTitle{position:absolute;top:4%;left:50%;transform:translateX(-50%);background:#ffd987;border:5px solid #8b4b18;border-radius:20px;padding:.8% 4%;font-size:clamp(18px,2.4vw,34px);font-weight:1000}.worlds{position:absolute;inset:0}.world{position:absolute;width:17%;aspect-ratio:1.25;border:6px solid #fff;border-radius:24px;color:#fff;font-weight:1000;font-size:clamp(12px,1.6vw,23px);cursor:pointer;box-shadow:0 8px 0 #123b55;text-shadow:0 2px #333}.world.lock{filter:grayscale(.8);opacity:.72;cursor:not-allowed}.world.done:after{content:"✓";position:absolute;right:-8px;top:-12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#2fd05a;border:3px solid #fff}.w1{left:10%;top:31%;background:#e53935}.w2{left:41%;top:24%;background:#3f66db}.w3{left:19%;top:64%;background:#28a64c}.w4{left:51%;top:64%;background:#7b45d7}.w5{left:74%;top:42%;background:#ef7d22}.stageTitle{position:absolute;left:50%;top:2%;transform:translateX(-50%);background:#b86225;border:5px solid #6e310d;color:#fff;border-radius:20px;padding:.6% 4%;font-size:clamp(18px,2.2vw,34px);font-weight:1000;text-shadow:0 3px #4b1b05;z-index:4}.instruction{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:60%;background:#fffef1;border:4px solid #50bfe9;border-radius:18px;padding:.8%;text-align:center;font-weight:1000;font-size:clamp(14px,1.7vw,25px);z-index:4}.challenge{position:absolute;left:50%;top:27%;transform:translateX(-50%);width:15%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#ffe8a8;border:7px solid #a45d1d;box-shadow:0 7px 0 #67350e;color:#174e9c;font-size:clamp(40px,7vw,100px);font-weight:1000;z-index:4}.choices{position:absolute;left:8%;right:8%;bottom:5%;height:30%;display:grid;grid-template-columns:repeat(4,1fr);gap:2%;z-index:4}.choice{position:relative;border:5px solid #52bee8;border-radius:20px;background:#fff;cursor:pointer;box-shadow:0 7px 0 #14709c;overflow:hidden}.choice img{width:100%;height:73%;object-fit:contain;padding:5%;pointer-events:none}.choice b{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:clamp(11px,1.35vw,20px)}.choice.ok{border-color:#2fd05a;box-shadow:0 0 0 7px #2fd05a,0 7px 0 #187c36}.choice.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.feedback{position:absolute;z-index:20;left:50%;top:52%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#2fd05a;color:#fff;border:6px solid #fff;border-radius:28px;padding:2% 5%;font-size:clamp(25px,4vw,56px);font-weight:1000;transition:.18s;pointer-events:none}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.endCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;background:#fffdf0;border:8px solid #ffd83f;border-radius:32px;padding:4%;text-align:center}.endCard h1{font-size:clamp(35px,5vw,70px);margin:0;color:#e58314}.endCard button{border:4px solid #fff;border-radius:20px;padding:14px 22px;margin:8px;background:#26b63b;color:#fff;font-weight:1000;cursor:pointer}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:12px;height:20px;background:#ffd83f;animation:fall 2s linear forwards}@keyframes fall{from{transform:translateY(-50px) rotate(0)}to{transform:translateY(900px) rotate(600deg)}}@media(max-width:700px){.screen{padding:0}.game{border-radius:0}.setupCard{width:82%;top:30%}.round{width:44px;height:44px;font-size:20px}.choices{left:3%;right:3%;gap:1%}.choice{border-width:3px}.brand{width:80%}}
</style></head><body>
<section id="setup" class="screen on"><div class="game"><img class="bg" src="assets/capa.svg"><div class="shade"></div><div class="brand"><h1>AVENTURA <span>DO ALFABETO</span></h1><p>Explore mundos, descubra letras, sílabas e palavras!</p></div><div class="setupCard"><div class="label">QUAL É O SEU NOME?</div><input id="name" class="name" placeholder="Digite seu nome" maxlength="18" autocomplete="off"><div class="label" style="margin-top:2%">ESCOLHA SEU PERSONAGEM</div><div id="avatars" class="avatars"></div><button id="start" class="start">▶ COMEÇAR</button><div id="notice" class="notice"></div></div></div></section>
<section id="map" class="screen"><div class="game"><img class="bg" src="assets/mapa.svg"><div class="mapTitle">ESCOLHA O MUNDO</div><div class="topbar"><button id="setupBack" class="round">⌂</button><div><span id="mapName" class="pill"></span> <span id="stars" class="pill">⭐ 0/25</span> <button class="round sound">♫</button></div></div><div id="worlds" class="worlds"></div></div></section>
<section id="stage" class="screen"><div class="game"><img id="stageBg" class="bg"><div class="shade"></div><div id="stageTitle" class="stageTitle"></div><div class="topbar"><button id="mapBack" class="round">←</button><div><span id="progress" class="pill"></span> <button class="round sound">♫</button></div></div><div id="instruction" class="instruction"></div><div id="challenge" class="challenge"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback">MUITO BEM! ⭐</div><div id="confetti" class="confetti"></div></div></section>
<section id="end" class="screen"><div class="game"><img class="bg" src="assets/parabens.svg"><div class="endCard"><h1>PARABÉNS!</h1><h2 id="winner"></h2><p>Você completou todas as fases da Aventura do Alfabeto!</p><button id="again">JOGAR NOVAMENTE</button><button id="endMap">VOLTAR AO MAPA</button></div></div></section>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const S={name:"",avatar:null,world:1,item:0,stars:0,unlocked:1,busy:false,sound:true,audio:null};
const worlds=["FLORESTA DAS VOGAIS","CASTELO DAS SÍLABAS","VILA DOS SONS","ILHA DAS LETRAS","MONTANHA DAS PALAVRAS"];
const data=[
{inst:"Clique na imagem que começa com a letra:",qs:[["A","abelha","casa","arvore","banana"],["E","elefante","uva","olho","ilha"],["I","ilha","abelha","uva","olho"],["O","olho","ilha","elefante","uva"],["U","uva","olho","abelha","ilha"]]},
{inst:"Clique na imagem que começa com a sílaba:",qs:[["CA","casa","cachorro","cavalo","colher"],["BO","bola","banana","casa","gato"],["GA","gato","casa","bola","mesa"],["MA","macaco","mesa","gato","bola"],["PA","pato","casa","gato","uva"]]},
{inst:"Clique na imagem que tem o som inicial:",qs:[["M","macaco","bola","mesa","gato"],["B","bola","gato","uva","casa"],["G","gato","mesa","bola","uva"],["C","casa","bola","gato","uva"],["U","uva","gato","casa","bola"]]},
{inst:"Clique na imagem que começa com a letra:",qs:[["U","uva","relogio","urso","igreja"],["R","relogio","uva","urso","igreja"],["I","igreja","urso","uva","relogio"],["U","urso","igreja","relogio","uva"],["A","abelha","igreja","uva","urso"]]},
{inst:"Clique na imagem que corresponde à palavra:",qs:[["SOL","sol","lua","estrela","nuvem"],["LUA","lua","sol","estrela","nuvem"],["ESTRELA","estrela","lua","sol","nuvem"],["NUVEM","nuvem","sol","lua","estrela"],["CASA","casa","sol","lua","nuvem"]]}
];
function avatarSvg(i){let skin=i<2?"#ffd0ad":"#8a4c2f",hair=i<2?"#5a2b18":"#24130f",shirt=i%2?"#f15a9d":"#2d7eea";return `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#dff8ff"/><circle cx="50" cy="43" r="24" fill="${skin}"/><path d="M25 40q4-31 25-31q24 0 27 31q-15-15-27-11q-12-5-25 11" fill="${hair}"/><circle cx="42" cy="44" r="3"/><circle cx="58" cy="44" r="3"/><path d="M42 56q8 8 16 0" fill="none" stroke="#9b3b39" stroke-width="3"/><path d="M18 100q5-32 32-32q27 0 32 32" fill="${shirt}"/><path d="M32 76l-8-15M68 76l8-15" stroke="#1c4d83" stroke-width="6"/></svg>`}
$("#avatars").innerHTML=[0,1,2,3].map(i=>`<button class="avatar" data-a="${i}">${avatarSvg(i)}</button>`).join("");
function show(id){$$(".screen").forEach(x=>x.classList.remove("on"));$("#"+id).classList.add("on")}
$$(".avatar").forEach(b=>b.addEventListener("click",()=>{$$(".avatar").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.avatar=+b.dataset.a}));
$("#start").addEventListener("click",()=>{let n=$("#name").value.trim();if(!n){$("#notice").textContent="Digite seu nome.";$("#name").focus();return}if(S.avatar===null){$("#notice").textContent="Escolha seu personagem.";return}S.name=n;$("#notice").textContent="";$("#mapName").textContent=n;music();openWorld(1)});
function music(){if(S.audio)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A(),master=c.createGain();master.gain.value=.025;master.connect(c.destination),notes=[261.6,329.6,392,523.2,392,349.2,293.7],i=0;function tick(){if(S.sound){let o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.11,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.38);o.connect(g);g.connect(master);o.start();o.stop(c.currentTime+.4)}setTimeout(tick,470)}tick();S.audio=c}
$$(".sound").forEach(b=>b.addEventListener("click",()=>{S.sound=!S.sound;$$(".sound").forEach(x=>x.textContent=S.sound?"♫":"♪")}));
function renderMap(){let box=$("#worlds");box.innerHTML="";worlds.forEach((w,i)=>{let n=i+1,b=document.createElement("button");b.className=`world w${n} ${n>S.unlocked?"lock":""} ${n<S.unlocked?"done":""}`;b.textContent=`${n} • ${w}`;if(n<=S.unlocked)b.addEventListener("click",()=>openWorld(n));box.appendChild(b)});$("#stars").textContent=`⭐ ${S.stars}/25`}
function openWorld(n){S.world=n;S.item=0;$("#stageBg").src=`assets/fase${n}.svg`;$("#stageTitle").textContent=`FASE ${n} • ${worlds[n-1]}`;show("stage");renderActivity()}
function renderActivity(){S.busy=false;let d=data[S.world-1],q=d.qs[S.item];$("#instruction").textContent=d.inst;$("#challenge").textContent=q[0];$("#progress").textContent=`${S.item+1}/5`;let box=$("#choices");box.innerHTML="";q.slice(1).forEach((name,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<img src="assets/${name}.svg" alt="${name}"><b>${name.toUpperCase()}</b>`;b.addEventListener("click",()=>answer(b,i===0));box.appendChild(b)})}
function confetti(){let c=$("#confetti");c.innerHTML="";for(let i=0;i<25;i++){let x=document.createElement("i");x.style.left=Math.random()*100+"%";x.style.background=["#ffd83f","#ff6cab","#42c9ff","#6ce35b"][i%4];x.style.animationDelay=(Math.random()*.35)+"s";c.appendChild(x)}setTimeout(()=>c.innerHTML="",2200)}
function answer(b,ok){if(S.busy)return;if(!ok){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),350);return}S.busy=true;b.classList.add("ok");$("#feedback").classList.add("show");confetti();setTimeout(()=>{$("#feedback").classList.remove("show");S.stars++;S.item++;if(S.item>=5){S.unlocked=Math.max(S.unlocked,S.world+1);if(S.world===5){$("#winner").textContent=S.name;show("end")}else openWorld(S.world+1)}else renderActivity()},700)}
$("#mapBack").addEventListener("click",()=>{renderMap();show("map")});$("#setupBack").addEventListener("click",()=>show("setup"));$("#again").addEventListener("click",()=>location.reload());$("#endMap").addEventListener("click",()=>{renderMap();show("map")});$("#name").value="";
</script></body></html>
