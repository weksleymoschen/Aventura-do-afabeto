<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aventura do Alfabeto — Novo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#0c5267;color:#3c260f}button,input{font:inherit}button{cursor:pointer}
.page{display:none;min-height:100vh}.page.on{display:block}.hero{min-height:100vh;background:url(assets/parque.png) center/cover;position:relative;padding:3vh 4vw}.glass{max-width:1050px;margin:auto;background:#fff9;border:6px solid #fff;border-radius:34px;box-shadow:0 20px 60px #0004;padding:24px;text-align:center}.logo{font-size:clamp(42px,8vw,92px);line-height:.82;font-weight:1000;color:#ff6249;text-shadow:0 5px #fff,0 9px #3b91c8}.logo span{color:#24a8e6}.tag{font-size:clamp(18px,2vw,28px);font-weight:900;margin:14px}.setup{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;align-items:center}.namebox{background:#fff5d6;border:4px solid #b97832;border-radius:24px;padding:18px}.namebox input{width:100%;padding:15px;border:3px solid #e3bd78;border-radius:15px;font-size:20px;text-align:center}.avatars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.av{border:5px solid transparent;border-radius:22px;background:#e9f8ff;padding:4px;min-height:145px}.av.sel{border-color:#ffb52f;background:#fff1aa;transform:translateY(-3px)}.av svg{width:100%;height:135px}.play{border:5px solid white;background:linear-gradient(#79eb31,#3bb914);color:#163b0c;border-radius:24px;padding:15px 38px;font-size:27px;font-weight:1000;box-shadow:0 8px 0 #247b10;margin-top:18px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff4d8;border-bottom:5px solid #a76728}.chosen{width:52px;height:52px;background:white;border:3px solid #d89d4c;border-radius:50%;overflow:hidden}.who{font-weight:1000}.prog{flex:1;height:18px;background:#fff;border:3px solid #d69b45;border-radius:20px;overflow:hidden}.prog i{display:block;width:0;height:100%;background:linear-gradient(90deg,#5bd263,#ffe344);transition:.4s}.small{border:0;background:white;border-radius:13px;padding:9px 12px;font-size:20px}
.stage{min-height:calc(100vh - 70px);position:relative;background:url(assets/parque.png) center/cover;overflow:hidden;padding:100px 20px 35px}.title{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:4;background:linear-gradient(#fff9d7,#ffd675);border:5px solid white;box-shadow:0 7px 0 #8d5b29;border-radius:25px;padding:10px 24px;text-align:center;font-size:clamp(20px,3vw,34px);font-weight:1000;min-width:min(700px,90%)}.board{position:relative;z-index:3;max-width:980px;margin:auto;background:#ffffffed;border:6px solid #fff;border-radius:32px;padding:24px;box-shadow:0 18px 50px #0003}.options{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-items:center}.opt{min-width:115px;min-height:105px;border:5px solid white;border-radius:24px;background:linear-gradient(#8de6ff,#4bbde9);box-shadow:0 7px 0 #276b89;font-size:48px;font-weight:1000;color:#20384c;transition:.15s}.opt:nth-child(2n){background:linear-gradient(#ffb6c3,#ff7894);box-shadow:0 7px 0 #a43c56}.opt:nth-child(3n){background:linear-gradient(#b7ef8e,#66ce54);box-shadow:0 7px 0 #378b2e}.opt:active{transform:translateY(5px);box-shadow:none}.photo{width:180px;height:160px;border:5px solid #eee;border-radius:24px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}.photo svg{width:95%;height:95%}.bigletter{font-size:100px;font-weight:1000;color:#ed533e;text-shadow:0 5px #ffcba9}.slots{display:flex;gap:8px;justify-content:center;margin:20px}.slot{width:65px;height:72px;background:#fff;border:4px solid #c48a45;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:1000}.hint{font-size:20px;text-align:center;margin:10px;color:#6d4b2b}.feedback{position:fixed;z-index:99;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;background:#fff7c7;border:7px solid white;border-radius:30px;padding:20px 32px;font-size:clamp(28px,5vw,60px);font-weight:1000;box-shadow:0 20px 60px #0005;pointer-events:none;transition:.2s}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.conf{position:fixed;top:-20px;z-index:100;width:12px;height:20px;animation:fall 1.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}.finish{min-height:100vh;background:url(assets/parque.png) center/cover;padding:8vh 20px}.finish .glass{max-width:720px}.cup{font-size:100px}.stars{font-size:45px}
@media(max-width:700px){.setup{grid-template-columns:1fr}.avatars{grid-template-columns:repeat(3,1fr)}.av{min-height:105px}.av svg{height:95px}.stage{padding-top:115px}.board{padding:15px}.photo{width:135px;height:125px}.opt{min-width:85px;min-height:80px;font-size:36px}}
</style></head><body>
<section id="start" class="page on hero"><div class="glass"><div class="logo">AVENTURA<br><span>DO ALFABETO</span></div><div class="tag">EXPLORAR • BRINCAR • DESCOBRIR • APRENDER</div><div class="setup"><div class="namebox"><h2>QUAL É O SEU NOME?</h2><input id="name" maxlength="14" placeholder="Digite seu nome"><p id="warn"></p></div><div><h2>ESCOLHA SEU PERSONAGEM</h2><div id="avatars" class="avatars"></div></div></div><button id="play" class="play">COMEÇAR ▶</button></div></section>
<section id="game" class="page"><header class="top"><div id="chosen" class="chosen"></div><span id="who" class="who"></span><div class="prog"><i id="bar"></i></div><span>⭐ <b id="score">0</b>/7</span><button id="sound" class="small">🔊</button><button id="home" class="small">🏠</button></header><main id="stage" class="stage"></main></section>
<section id="finish" class="page finish"><div class="glass"><div class="cup">🏆</div><h1 style="font-size:50px;color:#e9503c">PARABÉNS!</h1><h2 id="winner"></h2><p>VOCÊ COMPLETOU TODAS AS FASES!</p><div class="stars">⭐⭐⭐⭐⭐</div><button id="again" class="play">JOGAR NOVAMENTE</button></div></section><div id="fb" class="feedback"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let av=0,level=0,score=0,audio=null,music=true;
const skins=['#f1b58c','#e9aa82','#855039','#efc09b','#d99670','#a76b4b'],hairs=['#5b3823','#6f3f29','#211918','#d6a13e','#171516','#3b271d'],shirts=['#46a8e7','#ef6688','#5fbe68','#8d6adc','#ef654d','#efa43d'];
function person(i){return `<svg viewBox="0 0 100 135"><circle cx="50" cy="34" r="24" fill="${skins[i]}"/><path d="M25 36Q25 8 51 9Q80 10 76 42Q64 22 29 28" fill="${hairs[i]}"/><circle cx="41" cy="35" r="3"/><circle cx="59" cy="35" r="3"/><path d="M42 47Q50 54 59 47" fill="none" stroke="#8b4c43" stroke-width="2.5"/><rect x="29" y="61" width="43" height="44" rx="15" fill="${shirts[i]}"/><path d="M30 72L13 94M71 72L88 94" stroke="${skins[i]}" stroke-width="10" stroke-linecap="round"/><path d="M40 102L36 130M61 102L65 130" stroke="#35516c" stroke-width="12"/></svg>`}
for(let i=0;i<6;i++){let b=document.createElement('button');b.className='av'+(i===0?' sel':'');b.innerHTML=person(i);b.onclick=()=>{av=i;$$('.av').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('#avatars').appendChild(b)}
const art={
bola:`<svg viewBox="0 0 100 100"><defs><radialGradient id="g"><stop stop-color="#fff"/><stop offset="1" stop-color="#ddd"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#g)" stroke="#333" stroke-width="3"/><polygon points="50,26 64,37 59,54 41,54 36,37" fill="#222"/><path d="M36 37L20 31M64 37L80 31M59 54L71 72M41 54L29 72M50 26L50 10" stroke="#222" stroke-width="4"/></svg>`,
gato:`<svg viewBox="0 0 100 100"><path d="M23 35L17 10L40 27M77 35L83 10L60 27" fill="#d78b3a"/><ellipse cx="50" cy="54" rx="34" ry="32" fill="#e6a04e"/><path d="M31 35Q50 20 69 35" stroke="#9a5c2c" stroke-width="6"/><ellipse cx="39" cy="50" rx="5" ry="7" fill="#6ab36e"/><ellipse cx="61" cy="50" rx="5" ry="7" fill="#6ab36e"/><path d="M46 61L54 61L50 67Z" fill="#df7f87"/><path d="M50 67Q42 75 36 68M50 67Q58 75 64 68" fill="none" stroke="#67402c" stroke-width="3"/></svg>`,
maca:`<svg viewBox="0 0 100 100"><path d="M51 24Q55 10 68 8" stroke="#65451f" stroke-width="5"/><path d="M54 19Q70 10 79 24Q64 32 53 26" fill="#55a943"/><path d="M50 25C20 10 12 45 20 70C28 94 49 88 50 84C53 90 76 94 83 68C91 38 75 13 50 25Z" fill="#e84238" stroke="#ad2927" stroke-width="3"/></svg>`,
mesa:`<svg viewBox="0 0 100 100"><rect x="15" y="30" width="70" height="18" rx="3" fill="#a96b3b"/><path d="M24 48L19 88M76 48L81 88" stroke="#7a4829" stroke-width="9"/></svg>`,
macaco:`<svg viewBox="0 0 100 100"><circle cx="24" cy="45" r="13" fill="#8a4f2b"/><circle cx="76" cy="45" r="13" fill="#8a4f2b"/><circle cx="50" cy="50" r="33" fill="#81502e"/><ellipse cx="50" cy="59" rx="22" ry="19" fill="#e5b37e"/><circle cx="40" cy="45" r="4"/><circle cx="60" cy="45" r="4"/><path d="M40 66Q50 74 60 66" fill="none" stroke="#61351f" stroke-width="3"/></svg>`,
pato:`<svg viewBox="0 0 100 100"><ellipse cx="48" cy="63" rx="33" ry="23" fill="#f4d640"/><circle cx="66" cy="38" r="19" fill="#f4d640"/><path d="M82 39L98 46L82 51Z" fill="#ed8a24"/><circle cx="71" cy="34" r="3"/></svg>`
};
function show(id){$$('.page').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}
$('#play').onclick=()=>{let n=$('#name').value.trim();if(!n){$('#warn').textContent='Digite seu nome para começar.';return}$('#warn').textContent='';$('#who').textContent=n.toUpperCase();$('#chosen').innerHTML=person(av);level=0;score=0;$('#score').textContent=0;$('#bar').style.width='0';show('game');render();startMusic()}
$('#home').onclick=()=>{stopMusic();show('start')};$('#again').onclick=()=>show('start');$('#sound').onclick=()=>{music=!music;$('#sound').textContent=music?'🔊':'🔇';music?startMusic():stopMusic()}
function startMusic(){if(audio||!music)return;try{audio=new(window.AudioContext||window.webkitAudioContext)();let g=audio.createGain();g.gain.value=.018;g.connect(audio.destination);let ns=[261,329,392,523,392,349,329,293],t=audio.currentTime;for(let i=0;i<150;i++){let o=audio.createOscillator();o.type='triangle';o.frequency.value=ns[i%8];o.connect(g);o.start(t+i*.3);o.stop(t+i*.3+.2)}}catch(e){}}
function stopMusic(){if(audio){try{audio.close()}catch(e){}audio=null}}
function pop(ok,t){let f=$('#fb');f.textContent=t;f.classList.add('show');if(ok)conf();setTimeout(()=>f.classList.remove('show'),650)}
function conf(){let c=['#ff5d4c','#ffd33f','#4ed168','#54bfff','#ae73ed'];for(let i=0;i<28;i++){let x=document.createElement('i');x.className='conf';x.style.left=Math.random()*100+'%';x.style.background=c[i%5];x.style.animationDelay=Math.random()*.2+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}}
function good(){score++;$('#score').textContent=score;pop(1,'⭐ MUITO BEM!');setTimeout(()=>{level++;$('#bar').style.width=(level/7*100)+'%';if(level>=7){stopMusic();$('#winner').textContent=$('#name').value.trim().toUpperCase();show('finish');conf()}else render()},750)}
function bad(){pop(0,'💛 TENTE OUTRA!')}
function board(title,body,hint=''){ $('#stage').innerHTML=`<div class="title">${title}</div><section class="board">${body}${hint?`<div class="hint">${hint}</div>`:''}</section>`}
function opt(text,ok){let b=document.createElement('button');b.className='opt';b.textContent=text;b.onclick=ok?good:bad;return b}
function picture(kind,label,ok){let b=document.createElement('button');b.className='photo';b.innerHTML=art[kind];b.setAttribute('aria-label',label);b.onclick=ok?good:bad;return b}
function render(){if(level===0){board('FASE 1 • ENCONTRE A LETRA A','<div class="bigletter" style="text-align:center">A</div><div class="options" id="ops"></div>');[['A',1],['E',0],['B',0],['O',0]].forEach(x=>$('#ops').appendChild(opt(x[0],x[1])))}
if(level===1){board('FASE 2 • QUAL FIGURA COMEÇA COM B?','<div class="options" id="ops"></div>');$('#ops').append(picture('bola','bola',1),picture('gato','gato',0),picture('maca','maçã',0))}
if(level===2){board('FASE 3 • ESCOLHA A SÍLABA DE BOLA','<div class="options" style="margin-bottom:15px"><div class="photo">'+art.bola+'</div></div><div class="options" id="ops"></div>');[['BA',0],['BO',1],['BI',0],['BU',0]].forEach(x=>$('#ops').appendChild(opt(x[0],x[1])))}
if(level===3){wordPhase('FASE 4 • COMPLETE: GATO','GATO','G_TO',['A','E','O','U'])}
if(level===4){board('FASE 5 • QUAL COMEÇA COM M?','<div class="options" id="ops"></div>');$('#ops').append(picture('maca','maçã',1),picture('macaco','macaco',1),picture('mesa','mesa',1),picture('gato','gato',0))}
if(level===5){wordPhase('FASE 6 • MONTE A PALAVRA BOLA','BOLA','____',['B','O','L','A','M','S'],true)}
if(level===6){board('FASE 7 • DESAFIO FINAL: ENCONTRE P','<div class="options" style="margin-bottom:15px"><div class="photo">'+art.pato+'</div></div><div class="options" id="ops"></div>');[['P',1],['B',0],['D',0],['T',0]].forEach(x=>$('#ops').appendChild(opt(x[0],x[1])))}
}
function wordPhase(title,word,mask,letters,sequence=false){board(title,`<div class="slots" id="slots"></div><div class="options" id="ops"></div>`);let slots=$('#slots'),p=0;mask.split('').forEach((x,i)=>{let s=document.createElement('div');s.className='slot';s.textContent=x==='_'?'':x;slots.appendChild(s)});letters.forEach(l=>{let b=opt(l,0);b.onclick=()=>{if(sequence){if(l===word[p]){slots.children[p].textContent=l;p++;pop(1,'⭐');b.disabled=true;b.style.opacity=.45;if(p===word.length)setTimeout(good,500)}else bad()}else{let idx=mask.indexOf('_');if(l===word[idx]){slots.children[idx].textContent=l;good()}else bad()}};$('#ops').appendChild(b)})}
</script></body></html>
