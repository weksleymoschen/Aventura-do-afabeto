<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mundo Mágico da Alfabetização</title>
<style>
:root{--card:#fff9e8;--ink:#17324d;--yellow:#ffd84d;--green:#37c871;--orange:#ff8a3d;--blue:#42a5f5}
*{box-sizing:border-box} body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:var(--ink);overflow-x:hidden;
background:linear-gradient(#58c9ff 0 43%,#74d85e 43% 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background:
radial-gradient(circle at 8% 16%,#fff 0 35px,transparent 37px),
radial-gradient(circle at 86% 13%,#fff 0 50px,transparent 52px),
radial-gradient(circle at 65% 29%,#fff 0 25px,transparent 27px)}
#app{width:min(1050px,100%);margin:auto;min-height:100vh;padding:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.logo{font-size:clamp(23px,5vw,50px);font-weight:1000;color:#fff;text-shadow:0 3px 0 #0c72a9,2px 2px 7px #17324d;line-height:.9}
.logo b{color:#ffe33f}.round{border:3px solid #fff;border-radius:50%;width:48px;height:48px;background:#ff9d2e;font-size:25px;cursor:pointer;box-shadow:0 4px 0 #c96916}
.panel{background:rgba(255,249,232,.96);border:5px solid #fff;border-radius:25px;box-shadow:0 8px 0 rgba(29,86,42,.25);padding:18px;margin:12px auto;max-width:900px;text-align:center}
h1,h2,h3{margin:5px 0 12px}.hero{font-size:80px}.avatars{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.avatar{font-size:55px;padding:7px;border:5px solid transparent;border-radius:20px;background:#e9f8ff;cursor:pointer}
.avatar.sel{border-color:#ffb000;transform:scale(1.06)} input{font-size:22px;padding:12px;border-radius:15px;border:3px solid #7ac9ef;width:min(330px,90%)}
.big{border:0;border-radius:18px;background:linear-gradient(#59df7e,#1cab4c);color:#fff;font-weight:900;font-size:23px;padding:14px 28px;box-shadow:0 6px 0 #147c38;cursor:pointer;margin:9px}
.big:active,.choice:active,.level:active{transform:translateY(3px);box-shadow:none}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.level{position:relative;min-height:160px;border:5px solid #fff;border-radius:24px;padding:12px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:center;align-items:center;text-shadow:0 2px 2px #244}
.level:nth-child(1){background:linear-gradient(135deg,#ff8b4a,#ffd54f)}.level:nth-child(2){background:linear-gradient(135deg,#7e57c2,#42a5f5)}
.level:nth-child(3){background:linear-gradient(135deg,#ef5350,#ffca28)}.level:nth-child(4){background:linear-gradient(135deg,#26a69a,#66bb6a)}
.level:nth-child(5){background:linear-gradient(135deg,#42a5f5,#5c6bc0)}.level:nth-child(6){background:linear-gradient(135deg,#ab47bc,#ff7043)}
.level.lock{filter:grayscale(.7);opacity:.65}.level .ico{font-size:55px}.stars{font-size:22px;color:#ffe13a;text-shadow:0 1px 2px #6d4b00}
.progress{height:18px;background:#d9e9ef;border-radius:20px;overflow:hidden;margin:8px}.progress i{display:block;height:100%;background:#43c96b;width:0;transition:.4s}
.question{font-size:clamp(22px,4vw,35px);font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:14px;margin:18px auto;max-width:700px}
.choice{min-height:120px;border:5px solid #fff;border-radius:23px;background:#fff7d6;box-shadow:0 6px 0 #e0b23a;font-size:clamp(25px,5vw,45px);font-weight:1000;cursor:pointer;padding:10px;color:#263f57}
.choice small{display:block;font-size:18px}.choice.good{background:#8ff0a9}.choice.bad{background:#ffaaaa;animation:shake .25s}.speaker{font-size:28px;border:0;background:#ff9d2e;color:#fff;border-radius:50%;width:52px;height:52px;cursor:pointer}
.feedback{font-size:25px;font-weight:900;min-height:36px}.hidden{display:none!important}
.wordslots{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px}.slot{min-width:85px;padding:15px;border:4px dashed #4ba4d8;border-radius:15px;background:white;font-size:30px}
.confetti{position:fixed;top:-20px;font-size:25px;animation:fall 1.7s linear forwards;z-index:10}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}@keyframes shake{50%{transform:translateX(8px)}}
.footer{font-weight:800;text-align:center;color:#174b36;padding:8px}.teacher{font-size:14px;background:#ffffffbb;border-radius:15px;padding:10px;margin-top:10px}
@media(max-width:700px){.map{grid-template-columns:1fr 1fr}.level{min-height:135px}.choices{grid-template-columns:1fr 1fr}.choice{min-height:100px}.panel{padding:12px}.top .logo{max-width:75%}}
</style>
</head>
<body><div id="app"></div>
<script>
const A=document.querySelector('#app');
const levels=[
 {name:'Caça às Letras',ico:'🔤',desc:'Reconheça as letras'},
 {name:'Som Inicial',ico:'🐝',desc:'Letra e imagem'},
 {name:'Batalha das Sílabas',ico:'👏',desc:'Descubra as sílabas'},
 {name:'Escute e Encontre',ico:'🔊',desc:'Ouça e associe'},
 {name:'Monte a Palavra',ico:'🧩',desc:'Forme palavras'},
 {name:'Desafio Final',ico:'🏆',desc:'Mostre o que aprendeu'}];
let st=JSON.parse(localStorage.getItem('mma_state')||'null')||{name:'',avatar:'🧒',mode:'4-5',unlocked:1,stars:[0,0,0,0,0,0]};
let phase=0,q=0,score=0,currentSpeech='';
function save(){localStorage.setItem('mma_state',JSON.stringify(st))}
function speak(t){currentSpeech=t; if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.82;u.pitch=1.08;speechSynthesis.speak(u)}
function top(){return `<div class="top"><div class="logo">MUNDO MÁGICO<br><b>DA ALFABETIZAÇÃO</b></div><button class="round" onclick="home()">🏠</button></div>`}
function start(){
 A.innerHTML=`${top()}<section class="panel"><div class="hero">🌈📚✨</div><h1>UMA AVENTURA PARA APRENDER BRINCANDO!</h1>
 <p>Escolha seu personagem:</p><div class="avatars">${['🧒','👧','👦','👩🏽‍🦱'].map(x=>`<button class="avatar ${st.avatar==x?'sel':''}" onclick="pickAvatar(this,'${x}')">${x}</button>`).join('')}</div>
 <p><input id="nm" maxlength="18" placeholder="Digite o nome da criança" value="${st.name}"></p>
 <p><b>Faixa:</b> <label><input style="width:auto" type="radio" name="m" value="4-5" ${st.mode==='4-5'?'checked':''}> 4–5 anos</label> &nbsp; <label><input style="width:auto" type="radio" name="m" value="6-7" ${st.mode==='6-7'?'checked':''}> 6–7 anos</label></p>
 <button class="big" onclick="enter()">▶ COMEÇAR</button><div class="teacher">🔒 O progresso fica salvo neste aparelho. O jogo usa voz do próprio navegador e funciona sem internet depois de baixado.</div></section><div class="footer">Aprender • Ouvir • Clicar • Descobrir</div>`}
function pickAvatar(el,x){st.avatar=x;document.querySelectorAll('.avatar').forEach(e=>e.classList.remove('sel'));el.classList.add('sel')}
function enter(){st.name=document.querySelector('#nm').value.trim()||'Aventureiro';st.mode=document.querySelector('input[name=m]:checked').value;save();home();speak(`Olá ${st.name}! Escolha uma fase para começar.`)}
function home(){
 A.innerHTML=`${top()}<section class="panel"><h2>${st.avatar} Olá, ${st.name||'Aventureiro'}!</h2><p>ESCOLHA UMA FASE</p><div class="map">${levels.map((l,i)=>`<button class="level ${i+1>st.unlocked?'lock':''}" onclick="openLevel(${i})"><span class="ico">${i+1>st.unlocked?'🔒':l.ico}</span><b>FASE ${i+1}</b><strong>${l.name}</strong><small>${l.desc}</small><span class="stars">${'★'.repeat(st.stars[i])}${'☆'.repeat(3-st.stars[i])}</span></button>`).join('')}</div>
 <button class="big" onclick="start()">⚙ PERFIL</button><button class="big" onclick="resetGame()">↻ RECOMEÇAR</button></section>`}
function resetGame(){if(confirm('Apagar o progresso e recomeçar?')){st.unlocked=1;st.stars=[0,0,0,0,0,0];save();home()}}
const easy=[
 [{ask:'Clique na letra A',say:'Encontre a letra A',ans:'A',opts:['A','E','O','M']},{ask:'Clique na letra M',say:'Encontre a letra M',ans:'M',opts:['N','M','B','P']},{ask:'Clique na letra S',say:'Encontre a letra S',ans:'S',opts:['C','F','S','V']}],
 [{ask:'Qual começa com A?',say:'Qual destas figuras começa com a letra A?',ans:'🐝',opts:['🐝','🏠','🐱','🦆'],labels:['ABELHA','CASA','GATO','PATO']},{ask:'Qual começa com C?',say:'Qual destas figuras começa com C?',ans:'🏠',opts:['🐟','🏠','🐝','🦆'],labels:['PEIXE','CASA','ABELHA','PATO']},{ask:'Qual começa com G?',say:'Qual destas figuras começa com G?',ans:'🐱',opts:['🐱','🐸','🍎','🦆'],labels:['GATO','SAPO','MAÇÃ','PATO']}],
 [{ask:'Complete: CA + ?',say:'Casa. Complete a palavra. Cá mais...',ans:'SA',opts:['SA','PA','MA','LA']},{ask:'Complete: PA + ?',say:'Pato. Complete a palavra. Pá mais...',ans:'TO',opts:['BO','TO','LO','NO']},{ask:'Complete: BO + ?',say:'Bola. Complete a palavra. Bó mais...',ans:'LA',opts:['LA','TA','CA','DA']}],
 [{ask:'🔊 Ouça e clique',say:'Gato',ans:'🐱',opts:['🐱','🐶','🐟','🐸'],labels:['GATO','CACHORRO','PEIXE','SAPO']},{ask:'🔊 Ouça e clique',say:'Casa',ans:'🏠',opts:['🌳','🏠','🚗','⭐'],labels:['ÁRVORE','CASA','CARRO','ESTRELA']},{ask:'🔊 Ouça e clique',say:'Sol',ans:'☀️',opts:['🌙','⭐','☀️','☁️'],labels:['LUA','ESTRELA','SOL','NUVEM']}],
 [{ask:'Monte a palavra da figura: ☀️',say:'Monte a palavra Sol',ans:'SOL',parts:['S','O','L']},{ask:'Monte a palavra da figura: 🏠',say:'Monte a palavra Casa',ans:'CASA',parts:['CA','SA']},{ask:'Monte a palavra da figura: ⚽',say:'Monte a palavra Bola',ans:'BOLA',parts:['BO','LA']}],
 [{ask:'Qual palavra combina com 🐱?',say:'Qual palavra é gato?',ans:'GATO',opts:['GATO','PATO','RATO','MATO']},{ask:'Qual começa com S?',say:'Qual figura começa com S?',ans:'☀️',opts:['☀️','🐱','🏠','🍎'],labels:['SOL','GATO','CASA','MAÇÃ']},{ask:'Complete: BO + ?',say:'Complete a palavra Bola. Bó mais...',ans:'LA',opts:['LA','SA','TA','PA']}]
];
const hard=[
 easy[0],
 [{ask:'Qual começa com F?',say:'Qual destas figuras começa com F?',ans:'🔪',opts:['🔪','🐱','🏠','☀️'],labels:['FACA','GATO','CASA','SOL']},{ask:'Qual começa com P?',say:'Qual destas figuras começa com P?',ans:'🐟',opts:['🐟','🍎','🐱','🏠'],labels:['PEIXE','MAÇÃ','GATO','CASA']},{ask:'Qual começa com B?',say:'Qual destas figuras começa com B?',ans:'⚽',opts:['⚽','☀️','🐸','🏠'],labels:['BOLA','SOL','SAPO','CASA']}],
 [{ask:'Complete: JA + ?',say:'Janela. Complete a palavra.',ans:'NE',opts:['NE','ME','LE','PE']},{ask:'Complete: CA + DEI + ?',say:'Cadeira. Complete a palavra.',ans:'RA',opts:['RA','LA','SA','TA']},{ask:'Complete: BO + NE + ?',say:'Boneca. Complete a palavra.',ans:'CA',opts:['CA','GA','DA','PA']}],
 easy[3],
 [{ask:'Monte a palavra: 🐸',say:'Monte a palavra Sapo',ans:'SAPO',parts:['SA','PO']},{ask:'Monte a palavra: 🍌',say:'Monte a palavra Banana',ans:'BANANA',parts:['BA','NA','NA']},{ask:'Monte a palavra: 🪟',say:'Monte a palavra Janela',ans:'JANELA',parts:['JA','NE','LA']}],
 [{ask:'Qual palavra tem 3 sílabas?',say:'Qual palavra tem três sílabas?',ans:'BANANA',opts:['SOL','CASA','BANANA','PÃO']},{ask:'Complete JA + NE + ?',say:'Complete Janela.',ans:'LA',opts:['LA','RA','MA','TA']},{ask:'Qual começa com o som de B?',say:'Qual figura começa com o som B?',ans:'⚽',opts:['🐱','⚽','☀️','🏠'],labels:['GATO','BOLA','SOL','CASA']}]
];
function openLevel(i){if(i+1>st.unlocked){speak('Esta fase ainda está bloqueada. Complete a fase anterior.');return} phase=i;q=0;score=0;renderQ()}
function bank(){return st.mode==='6-7'?hard:easy}
let build='';
function renderQ(){
 let item=bank()[phase][q]; build='';
 A.innerHTML=`${top()}<section class="panel"><h3>FASE ${phase+1} • ${levels[phase].name}</h3><div class="progress"><i style="width:${q/3*100}%"></i></div><div class="question">${item.ask} <button class="speaker" onclick="speak(currentSpeech)">🔊</button></div>
 <div id="activity"></div><div class="feedback" id="fb"></div><p>⭐ Acertos: ${score}</p></section>`;
 currentSpeech=item.say;
 let act=document.querySelector('#activity');
 if(item.parts){
   let shuffled=[...item.parts].sort(()=>Math.random()-.5);
   act.innerHTML=`<div class="wordslots" id="slots"><span class="slot">?</span></div><div class="choices">${shuffled.map(x=>`<button class="choice" onclick="addPart('${x}',this)">${x}</button>`).join('')}</div><button class="big" onclick="checkBuild('${item.ans}')">✓ CONFERIR</button><button class="big" onclick="build='';document.querySelector('#slots').innerHTML='<span class=slot>?</span>'">↻ LIMPAR</button>`;
 }else{
   act.innerHTML=`<div class="choices">${item.opts.map((x,k)=>`<button class="choice" onclick="answer(this,'${String(x).replace(/'/g,"\\'")}','${String(item.ans).replace(/'/g,"\\'")}')">${x}${item.labels?`<small>${item.labels[k]}</small>`:''}</button>`).join('')}</div>`;
 }
 setTimeout(()=>speak(item.say),350)
}
function addPart(x,b){build+=x;b.disabled=true;document.querySelector('#slots').innerHTML=build.split(/(?=[A-Z])/).length?`<span class="slot">${build}</span>`:''}
function checkBuild(ans){if(build===ans){correct()}else{document.querySelector('#fb').textContent='💡 TENTE OUTRA VEZ!';speak('Quase! Tente outra vez.');build='';document.querySelectorAll('.choice').forEach(b=>b.disabled=false);document.querySelector('#slots').innerHTML='<span class="slot">?</span>'}}
function answer(btn,val,ans){if(val===ans){btn.classList.add('good');correct()}else{btn.classList.add('bad');document.querySelector('#fb').textContent='💡 TENTE OUTRA VEZ!';speak('Quase! Tente outra vez.');setTimeout(()=>btn.classList.remove('bad'),500)}}
function correct(){score++;document.querySelector('#fb').textContent='🎉 MUITO BEM!';speak('Muito bem!');confetti();document.querySelectorAll('.choice').forEach(b=>b.disabled=true);setTimeout(()=>{q++; if(q>=3)finish();else renderQ()},1200)}
function confetti(){for(let i=0;i<18;i++){let e=document.createElement('i');e.className='confetti';e.textContent=['🎉','⭐','✨','🎈'][i%4];e.style.left=Math.random()*95+'%';e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}}
function finish(){let stars=score===3?3:score===2?2:1;st.stars[phase]=Math.max(st.stars[phase],stars);st.unlocked=Math.max(st.unlocked,Math.min(6,phase+2));save();confetti();
 A.innerHTML=`${top()}<section class="panel"><div class="hero">🏆</div><h1>PARABÉNS, ${st.name}!</h1><h2>Você completou a Fase ${phase+1}!</h2><div class="stars" style="font-size:55px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>Você acertou ${score} de 3 desafios.</p><button class="big" onclick="home()">🗺 VOLTAR AO MAPA</button>${phase<5?`<button class="big" onclick="openLevel(${phase+1})">▶ PRÓXIMA FASE</button>`:''}</section>`;speak(`Parabéns ${st.name}! Você completou a fase!`)}
start();
</script></body></html>
