<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#0c3155;color:#17304a}
button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}
#app{width:100%;height:100%;display:grid;place-items:center;padding:clamp(6px,1vw,14px)}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));aspect-ratio:16/9;overflow:hidden;border-radius:clamp(0px,1.3vw,22px);box-shadow:0 18px 55px #00182c99;background:#cdeeff}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,#07284522,#07284508 38%,#061a3266)}
.brand{position:absolute;left:2%;bottom:2%;z-index:4;background:#ffffffdc;border:2px solid #fff;padding:.35em .75em;border-radius:999px;font-weight:900;color:#123d73;font-size:clamp(10px,1vw,16px);box-shadow:0 5px 14px #0003}
.topbar{position:absolute;z-index:10;top:2%;left:2%;right:2%;display:flex;justify-content:space-between;align-items:center;gap:1%}
.iconbtn{width:clamp(42px,4.6vw,72px);aspect-ratio:1;border:3px solid #fff;border-radius:22%;background:linear-gradient(#ffc74a,#f49418);box-shadow:0 6px 0 #9c5312,0 8px 18px #0004;color:#fff;font-size:clamp(19px,2.1vw,32px);font-weight:900}
.titleplate{max-width:70%;padding:.38em 1.1em;border-radius:18px;border:3px solid #ffe29a;background:linear-gradient(#1675c6,#0c4e9a);color:#fff;text-shadow:0 2px 0 #123;font-weight:1000;font-size:clamp(15px,2vw,31px);box-shadow:0 6px 0 #073c78,0 10px 22px #0003;text-align:center}
.start-wrap{position:absolute;inset:0;z-index:5;display:grid;grid-template-columns:42% 58%;align-items:center;padding:7% 5% 5%}
.hero-copy{align-self:start;padding-top:2%;color:#fff;text-shadow:0 4px 0 #123d73,0 7px 18px #0008}
.hero-copy h1{font-size:clamp(30px,4.6vw,76px);line-height:.9;margin:0 0 .18em;font-weight:1000;letter-spacing:-.035em}
.hero-copy h1 span{color:#ffe45e}.hero-copy p{font-size:clamp(13px,1.5vw,24px);line-height:1.25;font-weight:800;max-width:90%}
.panel{background:linear-gradient(180deg,#fffdf2f5,#fff4ccef);border:4px solid #fff;outline:3px solid #f2a52a;border-radius:clamp(18px,2vw,32px);box-shadow:0 14px 35px #002b4c66;padding:clamp(12px,1.4vw,24px)}
.setup{width:95%;justify-self:end}.label{display:block;font-weight:1000;color:#7d4a00;font-size:clamp(13px,1.2vw,20px);margin-bottom:.35em}
.name{width:100%;border:3px solid #74c7ed;border-radius:14px;padding:.65em .85em;background:#fff;font-weight:900;color:#17416b;outline:none}
.name:focus{border-color:#2b9b52;box-shadow:0 0 0 4px #8cf3ad88}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2.2%;margin:.8em 0}
.avatar{position:relative;border:3px solid #8bd5f4;border-radius:16px;background:#fff;overflow:hidden;padding:0;aspect-ratio:3/4;box-shadow:0 5px 0 #3a8db1;transition:.18s}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
.avatar:hover{transform:translateY(-3px)}.avatar.sel{border-color:#35b95d;box-shadow:inset 0 0 0 4px #9cf3b3,0 5px 0 #187d38;transform:translateY(-3px)}
.avatar.sel:after{content:"✓";position:absolute;right:6%;top:5%;display:grid;place-items:center;width:26%;aspect-ratio:1;border-radius:50%;background:#2fbd5b;color:white;font-weight:1000;border:2px solid white}
.primary{width:100%;border:0;border-radius:16px;padding:.72em 1em;background:linear-gradient(#5bdc75,#1ba847);box-shadow:0 7px 0 #126c31;color:white;font-weight:1000;font-size:clamp(14px,1.45vw,23px);text-shadow:0 2px #126c31}
.primary:active,.iconbtn:active,.choice:active{transform:translateY(3px);box-shadow:none}
.game-ui{position:absolute;z-index:5;inset:0;padding:8% 4% 3%;display:grid;grid-template-rows:auto auto 1fr;gap:1.5%}
.hud{display:flex;justify-content:center}.progress{background:#fffffff0;border:3px solid #fff;border-radius:999px;padding:.35em .9em;display:flex;align-items:center;gap:.45em;box-shadow:0 5px 15px #0003;font-weight:1000}
.dot{width:clamp(11px,1.2vw,18px);aspect-ratio:1;border-radius:50%;background:#cbd6df;border:2px solid #6b879d}.dot.done{background:#39c65b;border-color:#147c30}
.prompt{justify-self:center;width:min(72%,950px);background:#fff8dcef;border:3px solid #f0ad32;border-radius:18px;padding:.55em 1em;text-align:center;font-weight:1000;font-size:clamp(15px,1.55vw,25px);box-shadow:0 6px 15px #0003}
.challenge{display:flex;justify-content:center;align-items:center;gap:1%;margin-top:.5%}.token{min-width:clamp(78px,8vw,130px);padding:.18em .5em;border-radius:18px;border:5px solid #fff;background:linear-gradient(#fff4b7,#ffd66c);box-shadow:0 8px 0 #9e5818;color:#e33a38;font-size:clamp(40px,5vw,84px);font-weight:1000;text-align:center;text-shadow:0 2px white}
.player-mini{position:absolute;left:2.2%;bottom:4%;z-index:6;width:clamp(76px,10vw,160px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:4px solid #fff;background:#fff;box-shadow:0 8px 20px #0005}.player-mini img{width:100%;height:100%;object-fit:cover}
.choices{align-self:end;margin-left:10%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.2%;align-items:end}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr));margin-left:13%;margin-right:3%}
.choice{border:4px solid #72c9ee;background:linear-gradient(#fff,#f8fbff);border-radius:18px;box-shadow:0 7px 0 #2b7fa4,0 12px 20px #0003;padding:5% 5% 4%;min-width:0;transition:.15s}
.choice:hover{transform:translateY(-5px);border-color:#ffd24f}.choice img{display:block;width:100%;height:clamp(72px,10.5vw,168px);object-fit:contain;pointer-events:none}
.choice b{display:block;margin-top:.25em;font-size:clamp(11px,1.2vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#25394a}
.choice.wrong{animation:shake .32s;border-color:#ef3f47;background:#ffe5e7}.choice.correct{border-color:#31b65a;background:#e3ffe9;box-shadow:0 7px 0 #187c39,0 0 25px #6dff91}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
#toast{position:fixed;z-index:99;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;background:#fff;border:5px solid #3ac25e;border-radius:24px;padding:.45em 1em;font-weight:1000;font-size:clamp(24px,3vw,50px);color:#17833a;box-shadow:0 14px 45px #0006;transition:.18s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.map-ui{position:absolute;z-index:5;inset:0;padding:9% 5% 5%;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:1.4%}
.world{border:4px solid white;border-radius:20px;background:#ffffffeb;padding:.8em .5em;box-shadow:0 7px 0 #285d89,0 10px 20px #0004;font-weight:1000;color:#19426a;min-height:30%;font-size:clamp(11px,1.1vw,18px)}.world:disabled{filter:grayscale(.7);opacity:.78;cursor:not-allowed}.world.done{border-color:#59d278;background:#ecfff0}.world .state{display:block;font-size:clamp(24px,3vw,50px);margin-bottom:.25em}
.final-ui{position:absolute;z-index:5;inset:0;display:grid;grid-template-columns:42% 58%;align-items:center;padding:8% 7% 5%}.final-avatar{height:70%;justify-self:center;border-radius:28px;border:5px solid white;box-shadow:0 14px 30px #0005}.final-card{text-align:center}.final-card h1{margin:.1em;font-size:clamp(30px,4vw,66px);color:#165db1}.final-card h2{margin:.25em 0;color:#7d4a00;font-size:clamp(18px,2.2vw,36px)}.btnrow{display:flex;gap:3%;margin-top:1em}.btnrow button{flex:1}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:20}.confetti i{position:absolute;top:-10%;width:10px;height:18px;border-radius:3px;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
@media(max-aspect-ratio:10/9){
 body{overflow:auto;background:#d8f3ff}#app{min-height:100%;height:auto;padding:0}.stage{width:100vw;height:100svh;aspect-ratio:auto;border-radius:0}
 .start-wrap{grid-template-columns:1fr;padding:8vh 5vw 3vh;align-content:center}.hero-copy{text-align:center;padding:0}.hero-copy h1{font-size:clamp(34px,10vw,60px)}.hero-copy p{margin:.4em auto;max-width:90%}.setup{width:100%;max-height:63vh;overflow:hidden;padding:12px}
 .avatar-grid{gap:2%}.avatar{aspect-ratio:1/1.15}.primary{padding:.6em}.topbar{top:1%}.titleplate{font-size:clamp(13px,4vw,20px)}
 .game-ui{padding:9vh 3vw 2vh;grid-template-rows:auto auto 1fr}.prompt{width:92%;font-size:clamp(14px,4vw,20px)}.token{font-size:clamp(34px,12vw,56px)}
 .player-mini{display:none}.choices,.choices.four{margin:0;grid-template-columns:repeat(2,1fr);gap:1.2vh 2vw;align-self:end}.choices.five .choice:last-child{grid-column:1/3;width:49%;justify-self:center}
 .choice{padding:2.5%}.choice img{height:clamp(70px,16vh,125px)}.choice b{font-size:clamp(12px,3.4vw,16px)}
 .map-ui{padding:9vh 4vw 3vh;grid-template-columns:1fr 1fr;align-content:end;gap:1vh 2vw}.world{min-height:0}.world:last-child{grid-column:1/3}
 .final-ui{grid-template-columns:1fr;padding:10vh 6vw 4vh}.final-avatar{height:28vh}.final-card{padding:10px}.btnrow{flex-direction:column;gap:12px}
}

function bindTop(){document.querySelector("#sound")?.addEventListener("click",toggleSound);document.querySelector("#home")?.addEventListener("click",showMap)}
function toggleSound(){state.sound=!state.sound;if(state.sound) startMusic(); else stopMusic(); document.querySelector("#sound").textContent=state.sound?'♪':'×';}
function tone(freq,d=.12,type="sine",vol=.035){if(!state.sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}
function startMusic(){if(!state.sound||musicTimer)return;let seq=[392,523,659,523,440,587,698,587],i=0;musicTimer=setInterval(()=>tone(seq[i++%seq.length],.25,"sine",.012),420)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function showToast(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),700)}
function confetti(){let c=document.createElement("div");c.className="confetti";for(let i=0;i<45;i++){let p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=`hsl(${Math.random()*360} 85% 55%)`;p.style.animationDelay=Math.random()*.25+"s";c.append(p)}document.querySelector(".stage").append(c);setTimeout(()=>c.remove(),1900)}
function startScreen(){
 app.innerHTML=`<section class="stage">${bg(ART.academy)}<div class="brand">WM JOGOS EDUCATIVOS</div><div class="start-wrap">
 <div class="hero-copy"><h1>AVENTURA DO <span>ALFABETO</span></h1><p>Explore cinco mundos mágicos e descubra os poderes das letras, dos sons, das sílabas e das palavras!</p></div>
 <div class="panel setup"><label class="label" for="name">QUAL É O SEU NOME?</label><input id="name" class="name" maxlength="20" autocomplete="off" placeholder="Digite seu nome">
 <div class="label" style="margin-top:.7em">ESCOLHA SEU AVENTUREIRO</div><div class="avatar-grid">${avatarKeys.map((k,i)=>`<button class="avatar" data-av="${k}" aria-label="Aventureiro ${i+1}"><img src="${ART[k]}" alt=""></button>`).join("")}</div>
 <button class="primary" id="start">▶ COMEÇAR A AVENTURA</button></div></div></section>`;
 document.querySelectorAll(".avatar").forEach(b=>b.onclick=()=>{state.avatar=b.dataset.av;document.querySelectorAll(".avatar").forEach(x=>x.classList.toggle("sel",x===b));tone(620,.08)});
 document.querySelector("#start").onclick=()=>{let n=document.querySelector("#name").value.trim();if(!n)return showToast("DIGITE SEU NOME");if(!state.avatar)return showToast("ESCOLHA SEU AVENTUREIRO");state.name=n;state.phase=1;state.mission=0;startMusic();showPhase()};
}
function showPhase(){
 let [title,bgkey,instruction,missions]=PHASES[state.phase], [token,answer,opts]=missions[state.mission];
 let dots=missions.map((_,i)=>`<span class="dot ${i<state.mission?'done':''}"></span>`).join("");
 app.innerHTML=`<section class="stage">${bg(ART[bgkey])}${top(`FASE ${state.phase} • ${title}`)}<div class="brand">WM JOGOS EDUCATIVOS</div>
 <div class="game-ui"><div class="hud"><div class="progress">${dots} <b>${state.mission+1}/5</b></div></div>
 <div><div class="prompt">${instruction}</div><div class="challenge"><div class="token">${token}</div></div></div>
 <div class="choices ${opts.length===4?'four':'five'}">${opts.map(o=>`<button class="choice" data-o="${o}" aria-label="${names[o]}"><img src="assets/objects/${o}.svg" alt="${names[o]}"><b>${names[o]}</b></button>`).join("")}</div></div>
 <div class="player-mini"><img src="${ART[state.avatar]}" alt=""></div></section>`;
 bindTop();document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answerChoice(b,b.dataset.o===answer));
}
function answerChoice(btn,ok){
 if(state.locked)return;if(!ok){btn.classList.add("wrong");tone(180,.18,"sawtooth",.025);setTimeout(()=>btn.classList.remove("wrong"),420);return}
 state.locked=true;btn.classList.add("correct");tone(660,.1);setTimeout(()=>tone(880,.16),90);showToast("MUITO BEM!");confetti();
 setTimeout(()=>{state.mission++;if(state.mission<5){state.locked=false;showPhase()}else{state.completed.add(state.phase);state.unlocked=Math.max(state.unlocked,state.phase+1);if(state.phase<5){state.phase++;state.mission=0;state.locked=false;showPhase()}else showFinal()}},850)
}
function showMap(){
 const worlds=[[1,"FLORESTA DAS VOGAIS"],[2,"TORRE DAS SÍLABAS"],[3,"CIDADE DOS SONS"],[4,"ILHA DAS LETRAS"],[5,"MONTANHA DAS PALAVRAS"]];
 app.innerHTML=`<section class="stage">${bg(ART.map)}${top("MAPA DA AVENTURA",false)}<div class="brand">WM JOGOS EDUCATIVOS</div><div class="map-ui">${worlds.map(([n,t])=>{let done=state.completed.has(n),open=n<=state.unlocked;return `<button class="world ${done?'done':''}" data-p="${n}" ${open?'':'disabled'}><span class="state">${done?'✓ ★':open?'▶':'🔒'}</span>${n}. ${t}</button>`}).join("")}</div></section>`;
 bindTop();document.querySelectorAll(".world:not(:disabled)").forEach(b=>b.onclick=()=>{state.phase=+b.dataset.p;state.mission=0;showPhase()});
}
function showFinal(){
 tone(523,.18);setTimeout(()=>tone(659,.18),120);setTimeout(()=>tone(784,.35),240);
 app.innerHTML=`<section class="stage">${bg(ART.academy)}${top("MISSÃO CONCLUÍDA!",false)}<div class="brand">WM JOGOS EDUCATIVOS</div><div class="final-ui"><img class="final-avatar" src="${ART[state.avatar]}" alt=""><div class="panel final-card"><h1>PARABÉNS, ${state.name.toUpperCase()}!</h1><h2>VOCÊ COMPLETOU A<br>AVENTURA DO ALFABETO!</h2><p>★★★★★</p><div class="btnrow"><button class="primary" id="again">JOGAR NOVAMENTE</button><button class="primary" id="mapbtn">VOLTAR AO MAPA</button></div></div></div></section>`;
 bindTop();confetti();document.querySelector("#again").onclick=()=>{state.phase=1;state.mission=0;state.unlocked=1;state.completed.clear();showPhase()};document.querySelector("#mapbtn").onclick=showMap;
}
startScreen();

</script>
</body>
</html>
