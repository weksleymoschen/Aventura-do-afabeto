<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aventura do Alfabeto</title>
<style>
:root{--ink:#17324d;--yellow:#ffd84d;--green:#52bd61;--blue:#67c9ff;--red:#ff6b63;--card:#fffef7}
*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Trebuchet MS,Arial,sans-serif;background:#bdeaff;color:var(--ink);overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}.screen{display:none;min-height:100vh}.screen.active{display:block}
#start{background:linear-gradient(#82d8ff 0 58%,#7fd56b 58%);position:relative;overflow:hidden;padding:22px}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.88}.c1{width:120px;height:38px;top:40px;left:7%}.c2{width:160px;height:44px;top:95px;right:8%}
.startbox{position:relative;z-index:2;max-width:850px;margin:auto;text-align:center;background:rgba(255,255,255,.93);border:5px solid #fff;border-radius:32px;padding:22px;box-shadow:0 12px 0 rgba(31,96,62,.15)}
.logo{font-size:clamp(34px,7vw,72px);font-weight:1000;line-height:.9;color:#ff704d;text-shadow:0 4px #fff,0 7px #55a9e8}.sub{font-size:20px;margin:12px}
.name{width:min(420px,90%);padding:15px 18px;border:3px solid #7bc8ff;border-radius:18px;font-size:20px;text-align:center}
.avatars{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.avatar{width:110px;height:140px;border:4px solid transparent;border-radius:24px;background:#e9f8ff;padding:5px;transition:.15s}.avatar.sel{border-color:#ffb52e;transform:translateY(-5px);background:#fff4bd}
.avatar svg{width:100%;height:100%}.bigbtn{border:0;border-radius:20px;background:#ffbd2f;color:#493200;padding:15px 30px;font-size:24px;font-weight:900;box-shadow:0 6px 0 #d98b00}.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d98b00}
.topbar{position:sticky;top:0;z-index:20;background:#fff9;backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid #fff;flex-wrap:wrap}
.player{display:flex;align-items:center;gap:8px;font-weight:900}.mini{width:44px;height:52px}.progress{flex:1;min-width:130px;height:16px;background:#e4edf2;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:#5dc36b;transition:.3s}
.iconbtn{border:0;border-radius:14px;background:#fff;padding:10px 13px;font-size:20px}
.world{position:relative;min-height:650px;overflow:hidden;background:linear-gradient(#8cddff 0 55%,#73cf68 55%);touch-action:manipulation}
.sun{position:absolute;width:80px;height:80px;border-radius:50%;background:#ffe35b;top:40px;right:7%;box-shadow:0 0 0 14px #fff36a55}
.hill{position:absolute;bottom:0;border-radius:50% 50% 0 0;background:#56b95e}.h1{width:500px;height:230px;left:-120px}.h2{width:600px;height:270px;right:-180px;background:#67c765}
.tree{position:absolute;width:120px;height:220px}.trunk{position:absolute;width:35px;height:100px;background:#8b532d;bottom:0;left:42px;border-radius:12px}.crown{position:absolute;width:120px;height:125px;background:#42aa48;border-radius:50%;top:10px;box-shadow:-28px 35px #4fba50,28px 35px #38a443}
.prompt{position:absolute;z-index:8;left:50%;top:22px;transform:translateX(-50%);background:#fff;border:4px solid #fff6;border-radius:22px;padding:10px 18px;text-align:center;font-size:22px;font-weight:900;box-shadow:0 7px 0 #0001;min-width:min(520px,88%)}
.target{font-size:46px;color:#ff6b55}.clickable{position:absolute;z-index:7;border:0;transition:.15s;filter:drop-shadow(0 4px 2px #0002)}.clickable:hover{transform:scale(1.06)}.clickable:active{transform:scale(.94)}
.letterTile{width:78px;height:70px;border-radius:18px;font-size:34px;font-weight:1000;color:#18324b;border:4px solid #fff;box-shadow:0 6px 0 #0002}.yellow{background:#ffd84d}.pink{background:#ff8ea1}.cyan{background:#65d6f4}.lime{background:#8de46f}.orange{background:#ffad50}
.feedback{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;background:white;border-radius:28px;padding:18px 28px;font-size:30px;font-weight:1000;pointer-events:none;transition:.2s;box-shadow:0 10px 30px #0003}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.object{font-size:70px;background:transparent}.train{position:absolute;bottom:45px;left:5%;right:5%;display:flex;align-items:end;gap:4px;z-index:6}.engine,.wagon{height:115px;border:5px solid #8a4429;background:#f35f45;border-radius:20px;position:relative;display:flex;align-items:center;justify-content:center}.engine{width:150px}.wagon{flex:1;min-width:120px;background:#f7b73e}.wheel{position:absolute;width:34px;height:34px;border-radius:50%;background:#2f3540;border:6px solid #8e9aa3;bottom:-24px}.w1{left:15px}.w2{right:15px}.picbtn{border:0;background:#fff;border-radius:18px;font-size:56px;padding:8px 16px}.syllables{position:absolute;top:125px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;flex-wrap:wrap;justify-content:center}.syllables button{border:4px solid #fff;border-radius:16px;padding:10px 17px;font-size:28px;font-weight:1000;box-shadow:0 5px #0002}
.cater{position:absolute;left:50%;top:190px;transform:translateX(-50%);display:flex;flex-wrap:wrap;max-width:650px;justify-content:center;gap:0;z-index:6}.seg{width:58px;height:58px;border-radius:50%;background:#f2a632;border:4px solid #fff1;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;margin:-3px}
.keyboard{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);width:min(720px,94%);display:flex;flex-wrap:wrap;gap:7px;justify-content:center;z-index:10}.keyboard button{width:48px;height:48px;border:3px solid #fff;border-radius:50%;background:#ffd84d;font-size:20px;font-weight:900;box-shadow:0 4px #a96e17}.wordslots{position:absolute;top:125px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}.slot{width:55px;height:62px;border-bottom:6px solid #285f36;font-size:34px;text-align:center;font-weight:900}
.village .house{position:absolute;width:170px;height:130px;background:#ffe394;border:5px solid #fff;bottom:100px;border-radius:10px}.roof{position:absolute;width:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;border-bottom:90px solid #ef765c;top:-75px;left:-20px}.door{position:absolute;width:45px;height:75px;background:#8f5a3c;bottom:0;left:60px}
.finalbox{max-width:700px;margin:80px auto;background:#fff;border-radius:32px;padding:30px;text-align:center;border:7px solid #fff6;box-shadow:0 12px 30px #0002}.trophy{font-size:100px}
.confetti{position:fixed;z-index:99;width:10px;height:18px;top:-20px;animation:fall 1.3s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(520deg)}} 
@media(max-width:650px){.world{min-height:720px}.prompt{font-size:17px;top:12px}.target{font-size:38px}.letterTile{width:62px;height:58px;font-size:27px}.train{overflow-x:auto}.wagon{min-width:115px}.object{font-size:55px}.tree{transform:scale(.8)}}
</style>
</head>
<body>
<section id="start" class="screen active">
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="startbox">
<div class="logo">AVENTURA<br>DO ALFABETO</div>
<div class="sub">🌟 Escolha seu aventureiro e comece! 🌟</div>
<input id="name" class="name" maxlength="14" placeholder="SEU NOME" aria-label="Nome da criança">
<div class="avatars" id="avatars"></div>
<button id="startBtn" class="bigbtn">▶ JOGAR</button>
<p id="warn" aria-live="polite"></p>
</div></section>
<section id="game" class="screen">
<div class="topbar"><div class="player"><div id="mini" class="mini"></div><span id="pname"></span></div><div class="progress"><i id="bar"></i></div><button class="iconbtn" id="music" aria-label="Música">🔊</button><button class="iconbtn" id="home" aria-label="Início">🏠</button></div>
<div id="world" class="world"></div></section>
<section id="finish" class="screen"><div class="finalbox"><div class="trophy">🏆</div><h1>VOCÊ CONSEGUIU!</h1><h2 id="finishName"></h2><p style="font-size:28px">⭐⭐⭐⭐⭐</p><button id="again" class="bigbtn">JOGAR DE NOVO</button></div></section>
<script>
const $=s=>document.querySelector(s); let avatar=0,phase=0,musicOn=true,audio=null;
const skin=['#f1b38b','#8c573d','#d89b72','#6c432f','#f0c29f','#a96f50'], hair=['#513323','#241a18','#8b4b25','#161313','#d89b34','#3b261d'], shirt=['#55a9e8','#ef6d8b','#65be72','#ff9c49','#8569d9','#ef6461'];
function person(i,mini=false){return `<svg viewBox="0 0 100 140" aria-label="Avatar humano"><circle cx="50" cy="37" r="24" fill="${skin[i]}"/><path d="${i%3==0?'M25 37Q27 8 50 10Q78 9 76 40Q62 25 29 31':i%3==1?'M24 35Q28 5 52 9Q80 11 75 43Q66 21 32 24':'M25 39Q20 12 50 10Q79 11 76 40L68 25Q45 36 27 26'}" fill="${hair[i]}"/><circle cx="42" cy="38" r="2.4"/><circle cx="59" cy="38" r="2.4"/><path d="M43 49Q50 55 58 49" fill="none" stroke="#8d4b42" stroke-width="2.5" stroke-linecap="round"/><rect x="31" y="62" width="39" height="46" rx="14" fill="${shirt[i]}"/><path d="M31 72L14 94M70 72L87 94" stroke="${skin[i]}" stroke-width="11" stroke-linecap="round"/><path d="M40 105L35 133M60 105L65 133" stroke="#37506b" stroke-width="12" stroke-linecap="round"/><path d="M28 134h16M57 134h16" stroke="#263849" stroke-width="8" stroke-linecap="round"/></svg>`}
for(let i=0;i<6;i++){let b=document.createElement('button');b.className='avatar'+(i===0?' sel':'');b.innerHTML=person(i);b.onclick=()=>{avatar=i;document.querySelectorAll('.avatar').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('#avatars').appendChild(b)}
function screens(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
$('#startBtn').onclick=()=>{let n=$('#name').value.trim();if(!n){$('#warn').textContent='Digite seu nome para começar 😊';return}$('#pname').textContent=n;$('#mini').innerHTML=person(avatar,true);screens('game');phase=0;render();if(musicOn) startMusic()}
$('#home').onclick=()=>{stopMusic();screens('start')};$('#again').onclick=()=>screens('start');
$('#music').onclick=()=>{musicOn=!musicOn;$('#music').textContent=musicOn?'🔊':'🔇';musicOn?startMusic():stopMusic()}
function startMusic(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();let g=audio.createGain();g.gain.value=.025;g.connect(audio.destination);let notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23],t=audio.currentTime;for(let k=0;k<80;k++){let o=audio.createOscillator();o.type='sine';o.frequency.value=notes[k%notes.length];o.connect(g);o.start(t+k*.32);o.stop(t+k*.32+.22)}}catch(e){}}
function stopMusic(){if(audio){audio.close();audio=null}}
function base(title,target=''){return `<div class="sun"></div><div class="hill h1"></div><div class="hill h2"></div><div class="prompt">${title} ${target?`<span class="target">${target}</span>`:''}</div><div class="feedback" id="fb"></div>`}
function say(ok,msg){let f=$('#fb');f.textContent=msg;f.className='feedback show';if(ok)confetti();setTimeout(()=>f.className='feedback',650)}
function confetti(){for(let i=0;i<24;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ff665e','#ffd84d','#57c36a','#5bbfff','#a875e8'][i%5];c.style.animationDelay=Math.random()*.25+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),1700)}}
function next(){phase++;$('#bar').style.width=(phase/5*100)+'%';if(phase>=5){stopMusic();$('#finishName').textContent=$('#name').value.trim();screens('finish');confetti();return}render()}
function render(){let w=$('#world');w.className='world'; if(phase===0)forest(w);if(phase===1)train(w);if(phase===2)garden(w);if(phase===3)village(w);if(phase===4)park(w)}
function forest(w){w.innerHTML=base('TOQUE NA LETRA','A')+`<div class="tree" style="left:6%;bottom:65px"><i class="trunk"></i><i class="crown"></i></div><div class="tree" style="right:8%;bottom:55px"><i class="trunk"></i><i class="crown"></i></div>`;
[['M','yellow',18,38],['A','pink',44,48],['O','cyan',70,34],['E','lime',28,68],['U','orange',62,70]].forEach(([l,c,x,y])=>{let b=document.createElement('button');b.className='clickable letterTile '+c;b.textContent=l;b.style.left=x+'%';b.style.top=y+'%';b.onclick=()=>{if(l==='A'){say(1,'⭐ MUITO BEM!');setTimeout(next,750)}else say(0,'💛 TENTE OUTRA!')};w.appendChild(b)})}
function train(w){w.innerHTML=base('QUAL SÍLABA COMBINA COM A FIGURA?')+`<div class="syllables"></div><div class="train"><div class="engine">🚂<i class="wheel w1"></i><i class="wheel w2"></i></div><div class="wagon"><button class="picbtn" aria-label="Bola">⚽</button><i class="wheel w1"></i><i class="wheel w2"></i></div><div class="wagon"><button class="picbtn" aria-label="Gato">🐱</button><i class="wheel w1"></i><i class="wheel w2"></i></div><div class="wagon"><button class="picbtn" aria-label="Laranja">🍊</button><i class="wheel w1"></i><i class="wheel w2"></i></div></div>`;let done=new Set();[['BO','#69d6f4','⚽'],['GA','#7de36b','🐱'],['LA','#ff8098','🍊'],['FA','#ffb45e','x']].forEach(([s,c,a])=>{let b=document.createElement('button');b.textContent=s;b.style.background=c;b.onclick=()=>{if(a==='x')return say(0,'💛 TENTE OUTRA!');done.add(a);say(1,'⭐ '+s+'!');if(done.size===3)setTimeout(next,800)};w.querySelector('.syllables').appendChild(b)})}
function garden(w){w.innerHTML=base('MONTE A PALAVRA DA FIGURA')+`<div style="position:absolute;z-index:9;top:105px;left:50%;transform:translateX(-50%);font-size:72px">🍌</div><div class="wordslots">${[0,1,2,3].map(()=>'<span class="slot"></span>').join('')}</div><div class="cater">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x=>`<span class="seg">${x}</span>`).join('')}</div><div class="keyboard"></div>`;let word='BOLA',pos=0; // intentionally simple visual target replaced below
w.querySelector('div[style*="font-size:72px"]').textContent='⚽';let keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');keys.sort(()=>Math.random()-.5);keys.forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k===word[pos]){w.querySelectorAll('.slot')[pos].textContent=k;pos++;say(1,'⭐');if(pos===word.length)setTimeout(next,750)}else say(0,'💛')};w.querySelector('.keyboard').appendChild(b)})}
function village(w){w.classList.add('village');w.innerHTML=base('ENCONTRE O QUE COMEÇA COM','C')+`<div class="house" style="left:8%"><i class="roof"></i><i class="door"></i></div>`;[['🏠','casa',18,55,1],['🐱','gato',45,62,0],['🚗','carro',68,60,1],['⚽','bola',82,42,0]].forEach(([e,n,x,y,ok])=>{let b=document.createElement('button');b.className='clickable object';b.textContent=e;b.setAttribute('aria-label',n);b.style.left=x+'%';b.style.top=y+'%';b.onclick=()=>ok?(say(1,'⭐ ACERTOU!'),setTimeout(next,750)):say(0,'💛 TENTE OUTRO!');w.appendChild(b)})}
function park(w){w.innerHTML=base('DESAFIO FINAL — TOQUE EM','M')+`<div class="tree" style="left:4%;bottom:55px"><i class="trunk"></i><i class="crown"></i></div>`;[['M','lime',20,36,1],['N','pink',65,30,0],['W','yellow',76,58,0]].forEach(([l,c,x,y,ok])=>{let b=document.createElement('button');b.className='clickable letterTile '+c;b.textContent=l;b.style.left=x+'%';b.style.top=y+'%';b.onclick=()=>ok?(say(1,'🏆 PARABÉNS!'),setTimeout(next,800)):say(0,'💛 TENTE OUTRA!');w.appendChild(b)});let monkey=document.createElement('button');monkey.className='clickable object';monkey.textContent='🐒';monkey.style.left='43%';monkey.style.top='58%';monkey.setAttribute('aria-label','macaco');monkey.onclick=()=>say(1,'⭐ M DE MACACO!');w.appendChild(monkey)}
</script></body></html>
