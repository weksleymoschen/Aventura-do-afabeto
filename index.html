<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aventura do Alfabeto — WM Jogos Educativos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#083d60}button,input{font:inherit}.screen{display:none;position:fixed;inset:0}.screen.active{display:block}.frame{position:absolute;left:50%;top:50%;width:min(100vw,150vh);height:min(100vh,66.6667vw);transform:translate(-50%,-50%);overflow:hidden;background:#083d60}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.nameInput{position:absolute;left:27.1%;top:42.3%;width:31.5%;height:6.4%;z-index:5;border:0;background:rgba(255,255,255,.03);outline:0;text-align:center;font-weight:900;font-size:clamp(15px,2vw,32px);color:#153a72}.nameInput::placeholder{color:#777}.avatars{position:absolute;left:23.8%;top:55.5%;width:41.2%;height:17.2%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.7%;z-index:6}.avatar{border:0;background:transparent;border-radius:18px;cursor:pointer;touch-action:manipulation}.avatar.sel{outline:6px solid #2ed25b;outline-offset:-7px;box-shadow:inset 0 0 0 3px white}.start{position:absolute;left:27.9%;top:74.2%;width:31.8%;height:13.2%;border:0;background:transparent;z-index:6;cursor:pointer;border-radius:60px;touch-action:manipulation}.hint{position:absolute;left:25%;top:89%;width:40%;text-align:center;color:#fff;background:#003c76dd;border-radius:14px;padding:7px;font-weight:800;opacity:0;transition:.2s;z-index:8}.hint.show{opacity:1}
.mapUI{position:absolute;inset:0;z-index:5}.mapBtn{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:20px;touch-action:manipulation}.mapBtn:hover,.mapBtn:focus-visible{box-shadow:0 0 0 6px #fff9,0 0 25px #ffe12c}.mapBtn.lock{cursor:not-allowed}.mapBtn.done:after{content:"✓";position:absolute;right:0;top:-10%;background:#2dcc57;color:#fff;border:4px solid #fff;border-radius:50%;width:30%;aspect-ratio:1;display:grid;place-items:center;font-weight:1000;font-size:clamp(15px,2vw,30px)}.hud{position:absolute;right:1.5%;top:1.5%;display:flex;gap:8px;z-index:20}.pill,.iconBtn{background:#fff;color:#12356b;border:3px solid #c9edff;border-radius:18px;padding:9px 15px;font-weight:900;font-size:clamp(13px,1.6vw,24px)}.iconBtn{cursor:pointer}.stage{background:#075d48}.stagebg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.back{position:absolute;left:1.5%;top:2%;z-index:20;width:5.6%;aspect-ratio:1;border:4px solid #fff;border-radius:22%;background:linear-gradient(#ffd63b,#ff9d16);color:#fff;font-size:clamp(25px,3.5vw,54px);font-weight:1000;cursor:pointer}.title{position:absolute;top:2%;left:50%;transform:translateX(-50%);z-index:10;background:linear-gradient(#db8330,#9f4817);border:4px solid #71300c;color:#fff;padding:.7% 3%;border-radius:18px;font-size:clamp(17px,2.4vw,36px);font-weight:1000;white-space:nowrap;text-shadow:0 3px #4c1d08}.prompt{position:absolute;z-index:10;top:13%;left:50%;transform:translateX(-50%);width:58%;background:#fffffff2;border:5px solid #49bdf5;border-radius:24px;padding:1.1%;text-align:center;color:#12356b;font-size:clamp(16px,2vw,31px);font-weight:1000}.cards{position:absolute;z-index:10;left:19%;right:5%;top:26%;bottom:5%;display:grid;grid-template-columns:repeat(3,1fr);gap:3%}.card{position:relative;border:8px solid #9b5b1d;border-radius:50%;background:radial-gradient(circle,#fff4c9,#f1d18a 69%,#d98c32 70%);cursor:pointer;min-height:0;box-shadow:0 8px 0 #714012;overflow:hidden;touch-action:manipulation}.card .letter{position:absolute;left:8%;top:14%;font-size:clamp(36px,7vw,110px);font-weight:1000;color:#124b9b;text-shadow:0 4px #fff}.card img{position:absolute;right:4%;top:9%;width:56%;height:62%;object-fit:contain;pointer-events:none}.card .word{position:absolute;left:10%;right:10%;bottom:4%;background:#efb25d;border:3px solid #9a5a20;border-radius:10px;text-align:center;font-weight:1000;color:#4a210e;font-size:clamp(12px,1.5vw,23px);padding:3px}.card.ok{box-shadow:0 0 0 9px #2ed25b,0 8px 0 #187c36}.card.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.quiz{position:absolute;z-index:10;left:19%;right:7%;top:27%;bottom:8%;display:flex;flex-direction:column;justify-content:center;gap:5%}.question{background:#fffef4;border:5px solid #4abdf5;border-radius:24px;padding:2%;text-align:center;font-size:clamp(18px,2.4vw,36px);font-weight:1000;color:#12356b}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:3%}.answer{border:6px solid #d3b2ff;border-radius:22px;background:#fff;padding:8%;font-size:clamp(18px,2.2vw,34px);font-weight:1000;cursor:pointer;box-shadow:0 7px #9c7ac6}.answer.ok{background:#d9ffd9;border-color:#2dcc57}.answer.bad{background:#ffe0e0;animation:shake .3s}.feedback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);z-index:40;background:#2dcc57;color:#fff;border:6px solid #fff;border-radius:30px;padding:2% 5%;font-size:clamp(25px,4vw,60px);font-weight:1000;opacity:0;pointer-events:none;transition:.2s}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.endbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:8px solid #ffd43a;border-radius:30px;padding:5%;text-align:center;color:#12356b;width:65%}.endbox h1{font-size:clamp(30px,5vw,72px);margin:.2em}.endbox button{background:#25bd32;color:white;border:0;border-radius:20px;padding:18px 35px;font-weight:1000;font-size:24px;cursor:pointer}@media(max-width:760px){.cards{left:8%;right:3%;gap:2%}.hud{gap:3px}.pill,.iconBtn{padding:5px 8px}.card{border-width:5px}}
</style></head><body>
<section id="setup" class="screen active"><div class="frame"><img class="art" src="assets/capa.jpg"><input id="name" class="nameInput" maxlength="18" placeholder="Digite seu nome" autocomplete="off"><div class="avatars"><button class="avatar" data-a="0" aria-label="Menino"></button><button class="avatar" data-a="1" aria-label="Menina"></button><button class="avatar" data-a="2" aria-label="Menino negro"></button><button class="avatar" data-a="3" aria-label="Menina negra"></button></div><button id="start" class="start" aria-label="Começar"></button><div id="hint" class="hint"></div></div></section>
<section id="map" class="screen"><div class="frame"><img class="art" src="assets/capa.jpg"><div class="hud"><span id="mapName" class="pill"></span><span id="stars" class="pill">⭐ 0/25</span><button class="iconBtn music">♫</button></div><div id="mapUI" class="mapUI"></div></div></section>
<section id="game" class="screen stage"><div class="frame"><img class="stagebg" src="assets/forest.svg"><button id="back" class="back" aria-label="Voltar">←</button><div id="title" class="title"></div><div class="hud"><span id="gameName" class="pill"></span><span id="progress" class="pill"></span><button class="iconBtn music">♫</button></div><div id="prompt" class="prompt"></div><div id="content"></div><div id="feedback" class="feedback">MUITO BEM! ⭐</div></div></section>
<section id="end" class="screen"><div class="frame"><img class="stagebg" src="assets/forest.svg"><div class="endbox"><h1>🏆 GUARDIÃO DAS PALAVRAS</h1><h2 id="winner"></h2><p>Você completou toda a Aventura do Alfabeto!</p><button id="again">JOGAR NOVAMENTE</button></div></div></section>
<script>
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const S={name:"",avatar:null,world:1,item:0,stars:0,unlocked:1,busy:false,music:false};
const worlds=["FLORESTA DAS VOGAIS","VILA DOS SONS","MONTANHA DAS SÍLABAS","CASTELO DAS SÍLABAS","CASTELO DAS PALAVRAS"];
const p1=[
 {correct:0,pairs:[["A","ABELHA","abelha"],["E","ILHA","ilha"],["I","OLHO","olho"],["O","UVA","uva"],["U","ELEFANTE","elefante"]]},
 {correct:1,pairs:[["A","ILHA","ilha"],["E","ELEFANTE","elefante"],["I","UVA","uva"],["O","ABELHA","abelha"],["U","OLHO","olho"]]},
 {correct:2,pairs:[["A","OLHO","olho"],["E","UVA","uva"],["I","IGREJA","ilha"],["O","ELEFANTE","elefante"],["U","ABELHA","abelha"]]},
 {correct:3,pairs:[["A","UVA","uva"],["E","ABELHA","abelha"],["I","ELEFANTE","elefante"],["O","OLHO","olho"],["U","ILHA","ilha"]]},
 {correct:4,pairs:[["A","ELEFANTE","elefante"],["E","OLHO","olho"],["I","ABELHA","abelha"],["O","ILHA","ilha"],["U","UVA","uva"]]}
];
const qs=[
 [["Qual palavra começa com B?","BOLA","GATO","PATO"],["Qual palavra começa com C?","CASA","SAPO","MALA"],["Qual palavra começa com G?","GATO","BOLA","PATO"],["Qual palavra começa com P?","PATO","CASA","GATO"],["Qual palavra começa com M?","MALA","SAPO","BOLA"]],
 [["Qual é a sílaba inicial de BOLA?","BO","BA","LA"],["Qual é a sílaba inicial de CASA?","CA","SA","CO"],["Qual é a sílaba inicial de PATO?","PA","TO","PO"],["Qual é a sílaba inicial de GATO?","GA","TA","GO"],["Qual é a sílaba inicial de MALA?","MA","LA","MO"]],
 [["Junte: BO + LA","BOLA","BALA","LOBO"],["Junte: CA + SA","CASA","SACA","CAMA"],["Junte: PA + TO","PATO","PATA","TAPA"],["Junte: GA + TO","GATO","GOTA","TOGA"],["Junte: MA + LA","MALA","LAMA","MOLA"]],
 [["Complete: B _ L A","O","A","U"],["Complete: C A S _","A","O","E"],["Complete: P _ T O","A","E","I"],["Complete: G A T _","O","A","U"],["Complete: M A L _","A","O","E"]]
];
function show(id){$$(".screen").forEach(x=>x.classList.remove("active"));$("#"+id).classList.add("active")}
$$(".avatar").forEach(b=>b.onclick=()=>{$$(".avatar").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.avatar=+b.dataset.a});
$("#start").onclick=()=>{let n=$("#name").value.trim();if(!n)return hint("Digite seu nome para começar.");if(S.avatar===null)return hint("Escolha um personagem.");S.name=n;$("#mapName").textContent=n;$("#gameName").textContent=n;renderMap();show("map")};
function hint(t){$("#hint").textContent=t;$("#hint").classList.add("show");setTimeout(()=>$("#hint").classList.remove("show"),1600)}
const spots=[[68.4,18.5,14.7,15],[79.7,43,13.5,15],[84.1,72,14,16],[67.3,72,14,16],[84.2,17,14,16]];
function renderMap(){let m=$("#mapUI");m.innerHTML="";worlds.forEach((w,i)=>{let b=document.createElement("button"),q=spots[i],n=i+1;b.className="mapBtn "+(n>S.unlocked?"lock ":"")+(n<S.unlocked?"done ":"");b.style.cssText=`left:${q[0]}%;top:${q[1]}%;width:${q[2]}%;height:${q[3]}%`;b.ariaLabel=w+(n>S.unlocked?" bloqueado":"");if(n<=S.unlocked)b.onclick=()=>openWorld(n);m.appendChild(b)});$("#stars").textContent=`⭐ ${S.stars}/25`}
function openWorld(n){S.world=n;S.item=0;$("#title").textContent=worlds[n-1];show("game");renderActivity()}
function renderActivity(){S.busy=false;$("#progress").textContent=`⭐ ${S.stars} • ${S.item+1}/5`;if(S.world===1)return renderP1();renderQuiz()}
function renderP1(){let a=p1[S.item];$("#prompt").textContent="ENCONTRE A ÚNICA ASSOCIAÇÃO CORRETA!";let c=document.createElement("div");c.className="cards";a.pairs.forEach((x,i)=>{let b=document.createElement("button");b.className="card";b.innerHTML=`<span class="letter">${x[0]}</span><img src="assets/${x[2]}.svg" alt="${x[1]}"><span class="word">${x[1]}</span>`;b.onclick=()=>choose(b,i===a.correct);c.appendChild(b)});$("#content").replaceChildren(c)}
function renderQuiz(){let q=qs[S.world-2][S.item];$("#prompt").textContent="ESCOLHA A RESPOSTA CORRETA";let d=document.createElement("div");d.className="quiz";let qq=document.createElement("div");qq.className="question";qq.textContent=q[0];let aa=document.createElement("div");aa.className="answers";q.slice(1).forEach((t,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=t;b.onclick=()=>choose(b,i===0);aa.appendChild(b)});d.append(qq,aa);$("#content").replaceChildren(d)}
function choose(b,ok){if(S.busy)return;if(!ok){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),450);return}S.busy=true;b.classList.add("ok");$("#feedback").classList.add("show");setTimeout(()=>{$("#feedback").classList.remove("show");S.stars++;S.item++;if(S.item>=5){if(S.world===5){$("#winner").textContent=S.name;show("end");return}S.unlocked=Math.max(S.unlocked,S.world+1);openWorld(S.world+1)}else renderActivity()},650)}
$("#back").onclick=()=>{renderMap();show("map")};$("#again").onclick=()=>location.reload();$$(".music").forEach(b=>b.onclick=()=>{S.music=!S.music;b.textContent=S.music?"♪":"♫"});$("#name").value="";
</script></body></html>
