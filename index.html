<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aventura do Alfabeto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#083b42;font-family:Arial Rounded MT Bold,Trebuchet MS,Arial,sans-serif}
#game{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle,#1b7f63,#083b42)}
.stage{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-height:100vh;overflow:hidden;box-shadow:0 0 45px #001b;isolation:isolate}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:18px;z-index:5;-webkit-tap-highlight-color:transparent}
.hot:hover{outline:5px solid #fff8;box-shadow:0 0 20px #fff8}.hot:active{transform:scale(.97)}
.sel{outline:7px solid #ffe22f!important;box-shadow:0 0 26px #ffe22f!important}
.locked{cursor:not-allowed}
.topbtn{position:absolute;z-index:10;border:0;border-radius:15px;background:#ff7d19;color:#fff;font-size:clamp(18px,3vw,32px);font-weight:900;box-shadow:0 5px 0 #a8440a;cursor:pointer}
.music{right:2.1%;top:2.2%;width:7.5%;height:11%;font-size:0;background:transparent;box-shadow:none}.home{left:1.5%;top:2%;width:7.5%;height:11%;font-size:0;background:transparent;box-shadow:none}
.toast{position:absolute;z-index:20;left:50%;bottom:4%;transform:translateX(-50%);padding:12px 24px;border:4px solid #fff;border-radius:22px;background:#173b5eea;color:#fff;font-weight:900;font-size:clamp(16px,2.3vw,28px);text-align:center;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}.flash{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0}.flash.ok{background:#4cff6040;animation:flash .55s}.flash.no{background:#ff303045;animation:flash .45s}@keyframes flash{50%{opacity:1}}
.conf{position:absolute;z-index:30;top:-8%;font-size:clamp(18px,3vw,38px);animation:fall 1.4s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(120vh) rotate(600deg)}}
.overlay{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:#082d4aaa}.overlay.show{display:flex}
.modal{width:min(78%,700px);background:#fff7d8;border:7px solid white;border-radius:30px;padding:22px;text-align:center;color:#17334c;box-shadow:0 12px 30px #0008}
.modal h2{font-size:clamp(25px,4vw,48px);margin:5px}.modal p{font-size:clamp(17px,2.2vw,26px)}
.action{border:4px solid #fff;border-radius:18px;background:linear-gradient(#66e855,#15a63c);color:#fff;font-weight:900;font-size:clamp(17px,2.4vw,27px);padding:12px 22px;margin:6px;box-shadow:0 6px 0 #116f2d;cursor:pointer}
.stars{font-size:clamp(30px,5vw,60px);color:#ffd322;text-shadow:0 2px #754}
@media(max-aspect-ratio:3/2){.stage{width:100vw;height:auto}}@media(min-aspect-ratio:3/2){.stage{height:100vh;width:auto}}
</style>
</head>
<body><div id="game"></div>
<script>
'use strict';
const G=document.getElementById('game');
let st; try{st=JSON.parse(localStorage.getItem('aventura_prof'))}catch(e){}
st=st||{avatar:0,unlock:1,stars:[0,0,0,0,0,0],music:true};
let ctx=null, timer=null, phase=0;
const save=()=>localStorage.setItem('aventura_prof',JSON.stringify(st));
function stage(name, extra=''){G.innerHTML=`<div class="stage"><img class="art" src="assets/${name}.webp" alt=""><div id="flash" class="flash"></div><div id="toast" class="toast"></div>${extra}</div>`}
function toast(t){let x=document.getElementById('toast'); if(!x)return;x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1000)}
function burst(){let s=document.querySelector('.stage');for(let i=0;i<22;i++){let e=document.createElement('i');e.className='conf';e.textContent=['★','●','◆','✦'][i%4];e.style.left=Math.random()*100+'%';e.style.color=['#ffd322','#ff4e68','#35c9ff','#6ee85b'][i%4];e.style.animationDelay=Math.random()*.25+'s';s.appendChild(e);setTimeout(()=>e.remove(),1800)}}
function flash(ok){let f=document.getElementById('flash');f.className='flash '+(ok?'ok':'no');setTimeout(()=>f.className='flash',600)}
function startMusic(){
 if(!st.music)return;
 try{
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  if(timer)return;
  const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];
  let i=0;
  timer=setInterval(()=>{if(!st.music||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.42);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.44)},460);
 }catch(e){}
}
function toggleMusic(){st.music=!st.music;save(); if(st.music){startMusic();toast('MÚSICA LIGADA ♪')}else{if(timer){clearInterval(timer);timer=null}toast('MÚSICA DESLIGADA')}}
function musicBtn(){return `<button class="hot music" aria-label="Música" onclick="toggleMusic()"></button>`}
function homeBtn(){return `<button class="hot home" aria-label="Voltar ao mapa" onclick="map()"></button>`}
function start(){
 stage('inicio',`${musicBtn()}
 <button class="hot" style="left:6.5%;top:54%;width:23%;height:27%" onclick="avatar(0,this)"></button>
 <button class="hot" style="left:29.5%;top:54%;width:20%;height:27%" onclick="avatar(1,this)"></button>
 <button class="hot" style="left:51%;top:54%;width:20%;height:27%" onclick="avatar(2,this)"></button>
 <button class="hot" style="left:73%;top:54%;width:20%;height:27%" onclick="avatar(3,this)"></button>
 <button class="hot" style="left:22%;top:83%;width:56%;height:14%" onclick="begin()"></button>`);
 setTimeout(()=>{let hs=document.querySelectorAll('.hot');if(hs[st.avatar+1])hs[st.avatar+1].classList.add('sel')},20)
}
function avatar(n,b){st.avatar=n;save();document.querySelectorAll('.stage>.hot').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');startMusic()}
function begin(){startMusic();map()}
function map(){
 stage('mapa',`${musicBtn()}
 ${[0,1,2,3,4,5].map((n)=>`<button class="hot ${n+1>st.unlock?'locked':''}" aria-label="Fase ${n+1}" style="${[
 'left:10%;top:25%;width:22%;height:28%','left:53%;top:24%;width:22%;height:28%','left:70%;top:48%;width:22%;height:28%',
 'left:10%;top:61%;width:22%;height:28%','left:48%;top:64%;width:22%;height:28%','left:72%;top:72%;width:22%;height:25%'
 ][n]}" onclick="openPhase(${n})"></button>`).join('')}`)
}
const configs=[
 {correct:0,spots:[['22%','68%','19%','23%'],['42%','68%','18%','23%'],['61%','68%','18%','23%'],['80%','68%','18%','23%']]},
 {correct:0,spots:[['25%','72%','17%','23%'],['43%','72%','17%','23%'],['61%','72%','17%','23%'],['79%','72%','17%','23%']]},
 {correct:1,spots:[['67%','38%','27%','15%'],['67%','54%','27%','15%'],['67%','70%','27%','15%'],['67%','85%','27%','12%']]},
 {correct:0,spots:[['27%','70%','19%','24%'],['47%','70%','16%','24%'],['64%','70%','16%','24%'],['81%','70%','16%','24%']]},
 {sequence:[1,3],spots:[['22%','80%','18%','15%'],['40%','80%','18%','15%'],['59%','80%','18%','15%'],['78%','80%','18%','15%']]},
 {correct:0,spots:[['9%','69%','19%','24%'],['29%','69%','19%','24%'],['49%','69%','19%','24%'],['69%','69%','19%','24%']]}
];
let seq=[];
function openPhase(n){
 if(n+1>st.unlock){toast('COMPLETE A FASE ANTERIOR');return}
 phase=n;seq=[];let c=configs[n];
 stage('fase'+(n+1),`${homeBtn()}${musicBtn()}${c.spots.map((p,i)=>`<button class="hot" style="left:${p[0]};top:${p[1]};width:${p[2]};height:${p[3]}" onclick="pickAnswer(${i},this)"></button>`).join('')}
 <div class="overlay" id="done"><div class="modal"><h2>PARABÉNS!</h2><div class="stars">★★★</div><p>Você concluiu a fase ${n+1}.</p><button class="action" onclick="map()">VOLTAR AO MAPA</button>${n<5?`<button class="action" onclick="openPhase(${n+1})">PRÓXIMA FASE</button>`:`<button class="action" onclick="finish()">VER RESULTADO</button>`}</div></div>`)
}
function pickAnswer(i,b){
 let c=configs[phase];
 if(c.sequence){
   if(seq.includes(i))return;
   seq.push(i);b.classList.add('sel');
   let expected=c.sequence[seq.length-1];
   if(i!==expected){flash(false);toast('TENTE OUTRA VEZ');setTimeout(()=>{seq=[];document.querySelectorAll('.stage>.hot').forEach(x=>x.classList.remove('sel'))},550);return}
   if(seq.length===c.sequence.length)correct();
 } else if(i===c.correct){b.classList.add('sel');correct()}else{flash(false);toast('QUASE! TENTE NOVAMENTE')}
}
function correct(){flash(true);burst();toast('MUITO BEM!');st.stars[phase]=3;st.unlock=Math.max(st.unlock,Math.min(6,phase+2));save();setTimeout(()=>document.getElementById('done').classList.add('show'),850)}
function finish(){
 stage('final',`${musicBtn()}
 <button class="hot" style="left:15%;top:83%;width:38%;height:13%" onclick="restart()"></button>
 <button class="hot" style="left:62%;top:83%;width:32%;height:13%" onclick="map()"></button>`);
 burst()
}
function restart(){st.unlock=1;st.stars=[0,0,0,0,0,0];save();start()}
window.addEventListener('error',e=>console.error(e.error||e.message));
start();
</script></body></html>
