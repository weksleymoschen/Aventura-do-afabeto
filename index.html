<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aventura do Alfabeto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063e60;font-family:Arial,sans-serif}button,input{font:inherit}.screen{display:none;position:fixed;inset:0}.screen.on{display:grid;place-items:center}.canvas{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-height:100vh;overflow:hidden;background:#063e60}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}.hot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.name{position:absolute;z-index:6;left:24.2%;top:40.5%;width:52%;height:8.7%;border:0;outline:0;background:white;border-radius:18px;text-align:center;font-weight:900;color:#23426b;font-size:clamp(15px,2vw,31px)}.name::placeholder{color:#777}.avatars{position:absolute;z-index:6;left:14.5%;right:6.2%;top:57.1%;height:23%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6%}.avatar{border:0;background:transparent;border-radius:17px;cursor:pointer}.avatar.sel{outline:6px solid #32d35c;outline-offset:-7px;box-shadow:inset 0 0 0 3px #fff}.start{left:31.3%;top:83.4%;width:45%;height:12.4%;border-radius:50px}.msg{position:absolute;z-index:9;left:31%;right:23%;bottom:1%;background:#063e60e8;color:white;text-align:center;border-radius:12px;padding:6px;font-weight:900;opacity:0}.msg.show{opacity:1}.mapzone{position:absolute;border:0;background:transparent;border-radius:20px;cursor:pointer}.mapzone:not(.lock):hover{box-shadow:inset 0 0 0 6px #fff9,0 0 22px #ffe23a}.mapzone.done:after{content:"✓";position:absolute;right:0;top:-8%;width:25%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#2ed05a;color:#fff;border:3px solid white;font-weight:1000}.hud{position:absolute;z-index:20;right:1.2%;top:1.5%;display:flex;gap:6px}.pill,.sound,.home{border:3px solid white;background:#f5a313;color:white;border-radius:15px;padding:7px 11px;font-weight:900}.sound,.home{cursor:pointer}.home{position:absolute;z-index:20;left:1.5%;top:2%;width:7%;aspect-ratio:1;padding:0;font-size:clamp(20px,3vw,40px)}.coverLayer{position:absolute;z-index:4;left:0;right:0;bottom:0;height:36%;background:linear-gradient(transparent 0%,rgba(5,65,70,.25) 18%,rgba(6,62,75,.65) 100%);pointer-events:none}.prompt{position:absolute;z-index:10;left:50%;top:17%;transform:translateX(-50%);width:62%;background:#fffdf0;border:4px solid #48bdf3;border-radius:18px;padding:.8%;text-align:center;color:#173d70;font-weight:1000;font-size:clamp(14px,1.7vw,27px)}.challenge{position:absolute;z-index:10;left:50%;top:29%;transform:translateX(-50%);width:17%;aspect-ratio:1;display:grid;place-items:center;border:7px solid #a45c19;border-radius:50%;background:#ffe9ae;color:#154c9c;font-size:clamp(42px,7vw,105px);font-weight:1000;box-shadow:0 7px #67350e}.choices{position:absolute;z-index:11;left:12%;right:4%;bottom:5%;height:27%;display:grid;grid-template-columns:repeat(4,1fr);gap:2%}.choice{position:relative;border:5px solid #54bee9;border-radius:18px;background:#fff;cursor:pointer;box-shadow:0 6px #176e9a;overflow:hidden;touch-action:manipulation}.choice .pic{height:72%;display:grid;place-items:center;font-size:clamp(38px,5vw,78px)}.choice b{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:clamp(11px,1.25vw,20px);color:#222}.choice.ok{border-color:#2fd05a;box-shadow:0 0 0 6px #2fd05a,0 6px #187c36}.choice.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.feedback{position:absolute;z-index:30;left:50%;top:53%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#2fd05a;color:#fff;border:5px solid #fff;border-radius:24px;padding:1.5% 4%;font-size:clamp(22px,3.4vw,52px);font-weight:1000;transition:.18s;pointer-events:none}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.progress{position:absolute;z-index:20;right:11%;top:4%;background:#fff;border:3px solid #31d05a;border-radius:16px;padding:5px 10px;color:#1a5a2c;font-weight:1000}.endBtns{position:absolute;z-index:10;left:31%;right:7%;bottom:5%;display:flex;gap:3%}.endBtns button{flex:1;border:4px solid white;border-radius:20px;padding:12px;color:white;font-weight:1000;font-size:clamp(13px,1.6vw,24px);cursor:pointer}.again{background:#267be8}.toMap{background:#24b735}@media(max-width:600px){.avatar.sel{outline-width:4px;outline-offset:-5px}.pill{padding:4px 7px}.choices{left:4%;right:2%;gap:1%}.choice{border-width:3px}}
</style></head><body>
<section id="setup" class="screen on"><div class="canvas"><img class="art" src="assets/capa.webp" alt=""><input id="name" class="name" maxlength="18" autocomplete="off" placeholder="Digite seu nome"><div class="avatars"><button class="avatar" data-a="0" aria-label="Menino"></button><button class="avatar" data-a="1" aria-label="Menina"></button><button class="avatar" data-a="2" aria-label="Menino negro"></button><button class="avatar" data-a="3" aria-label="Menina negra"></button></div><button id="start" class="hot start" aria-label="Começar"></button><div id="msg" class="msg"></div></div></section>
<section id="map" class="screen"><div class="canvas"><img id="mapArt" class="art" src="assets/mapa.webp" alt=""><div class="hud"><span id="mapName" class="pill"></span><span id="stars" class="pill">⭐ 0/25</span><button class="sound">♫</button></div><div id="mapZones"></div></div></section>
<section id="game" class="screen"><div class="canvas"><img id="phaseArt" class="art" alt=""><div class="coverLayer"></div><button id="home" class="home">⌂</button><div class="hud"><span id="player" class="pill"></span><button class="sound">♫</button></div><div id="progress" class="progress">1/5</div><div id="prompt" class="prompt"></div><div id="challenge" class="challenge"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback">MUITO BEM! ⭐</div></div></section>
<section id="end" class="screen"><div class="canvas"><img class="art" src="assets/parabens.webp" alt=""><div class="endBtns"><button id="again" class="again">↻ JOGAR NOVAMENTE</button><button id="toMap" class="toMap">⌂ VOLTAR AO MAPA</button></div></div></section>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const S={name:"",avatar:null,world:1,item:0,stars:0,unlocked:1,busy:false,sound:true,audio:null};
const worlds=["FLORESTA DAS VOGAIS","CASTELO DAS SÍLABAS","VILA DOS SONS","ILHA DAS LETRAS","MONTANHA DAS PALAVRAS"];
const emoji={abelha:"🐝",casa:"🏠",arvore:"🌳",banana:"🍌",elefante:"🐘",uva:"🍇",olho:"👁️",ilha:"🏝️",cachorro:"🐶",cavalo:"🐴",colher:"🥄",bola:"⚽",gato:"🐱",mesa:"🪑",macaco:"🐵",pato:"🦆",relogio:"🕐",urso:"🐻",igreja:"⛪",sol:"☀️",lua:"🌙",estrela:"⭐",nuvem:"☁️"};
const data=[
 {inst:"Clique na imagem que começa com a letra:",qs:[["A","abelha","casa","arvore","banana"],["E","elefante","uva","olho","ilha"],["I","ilha","abelha","uva","olho"],["O","olho","ilha","elefante","uva"],["U","uva","olho","abelha","ilha"]]},
 {inst:"Clique na imagem que começa com a sílaba:",qs:[["CA","casa","cachorro","cavalo","colher"],["BO","bola","banana","casa","gato"],["GA","gato","casa","bola","mesa"],["MA","macaco","mesa","gato","bola"],["PA","pato","casa","gato","uva"]]},
 {inst:"Clique na imagem que tem o som inicial:",qs:[["M","macaco","bola","mesa","gato"],["B","bola","gato","uva","casa"],["G","gato","mesa","bola","uva"],["C","casa","bola","gato","uva"],["U","uva","gato","casa","bola"]]},
 {inst:"Clique na imagem que começa com a letra:",qs:[["U","uva","relogio","urso","igreja"],["R","relogio","uva","urso","igreja"],["I","igreja","urso","uva","relogio"],["U","urso","igreja","relogio","uva"],["A","abelha","igreja","uva","urso"]]},
 {inst:"Clique na imagem que corresponde à palavra:",qs:[["SOL","sol","lua","estrela","nuvem"],["LUA","lua","sol","estrela","nuvem"],["ESTRELA","estrela","lua","sol","nuvem"],["NUVEM","nuvem","sol","lua","estrela"],["CASA","casa","sol","lua","nuvem"]]}
];
function show(id){$$(".screen").forEach(x=>x.classList.remove("on"));$("#"+id).classList.add("on")}
function say(t){$("#msg").textContent=t;$("#msg").classList.add("show");setTimeout(()=>$("#msg").classList.remove("show"),1300)}
$$(".avatar").forEach(b=>b.addEventListener("click",()=>{$$(".avatar").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.avatar=+b.dataset.a}));
$("#start").addEventListener("click",()=>{let n=$("#name").value.trim();if(!n)return say("Digite seu nome.");if(S.avatar===null)return say("Escolha seu personagem.");S.name=n;$("#mapName").textContent=n;$("#player").textContent=n;music();openWorld(1)});
function music(){if(S.audio)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A(),master=c.createGain();master.gain.value=.025;master.connect(c.destination);let notes=[261.6,329.6,392,523.2,392,329.6,293.7,349.2],i=0;function tick(){if(S.sound){let o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.38);o.connect(g);g.connect(master);o.start();o.stop(c.currentTime+.4)}setTimeout(tick,470)}tick();S.audio=c}
$$(".sound").forEach(b=>b.addEventListener("click",()=>{S.sound=!S.sound;$$(".sound").forEach(x=>x.textContent=S.sound?"♫":"♪")}));
const spots=[[7,33,31,29],[38,26,30,31],[5,62,31,28],[40,62,31,28],[70,42,28,30]];
function renderMap(){let m=$("#mapZones");m.innerHTML="";worlds.forEach((w,i)=>{let n=i+1,q=spots[i],b=document.createElement("button");b.className="mapzone "+(n>S.unlocked?"lock ":"")+(n<S.unlocked?"done ":"");b.style.cssText=`left:${q[0]}%;top:${q[1]}%;width:${q[2]}%;height:${q[3]}%`;b.setAttribute("aria-label",w);if(n<=S.unlocked)b.addEventListener("click",()=>openWorld(n));m.appendChild(b)});$("#stars").textContent=`⭐ ${S.stars}/25`;$("#mapArt").src=S.unlocked>5?"assets/mapa_final.webp":"assets/mapa.webp"}
function openWorld(n){S.world=n;S.item=0;$("#phaseArt").src=`assets/fase${n}.webp`;show("game");renderActivity()}
function renderActivity(){S.busy=false;let d=data[S.world-1],q=d.qs[S.item];$("#prompt").textContent=d.inst;$("#challenge").textContent=q[0];$("#progress").textContent=`${S.item+1}/5`;let box=$("#choices");box.innerHTML="";q.slice(1).forEach((name,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<div class="pic">${emoji[name]||"❓"}</div><b>${name.toUpperCase()}</b>`;b.addEventListener("click",()=>answer(b,i===0));box.appendChild(b)})}
function answer(b,ok){if(S.busy)return;if(!ok){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),380);return}S.busy=true;b.classList.add("ok");$("#feedback").classList.add("show");setTimeout(()=>{$("#feedback").classList.remove("show");S.stars++;S.item++;if(S.item>=5){S.unlocked=Math.max(S.unlocked,S.world+1);if(S.world===5){S.unlocked=6;show("end")}else openWorld(S.world+1)}else renderActivity()},650)}
$("#home").addEventListener("click",()=>{renderMap();show("map")});$("#again").addEventListener("click",()=>location.reload());$("#toMap").addEventListener("click",()=>{renderMap();show("map")});$("#name").value="";
</script></body></html>
