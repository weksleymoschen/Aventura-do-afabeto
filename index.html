<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aventura do Alfabeto — WM Jogos Educativos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0b7ea9}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#game{width:100vw;height:100vh;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:none}
.overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,30,60,.12),rgba(0,0,0,.02))}
.card{position:absolute;background:rgba(255,255,255,.96);border:4px solid #55c6ff;border-radius:28px;box-shadow:0 8px 0 rgba(0,70,120,.18)}
#setupPanel{left:28%;top:18%;width:48%;padding:2.1%;text-align:center}
.logo{font-weight:1000;font-size:clamp(28px,4vw,62px);color:#073c79;text-shadow:0 2px white}
.sub{font-size:clamp(15px,1.5vw,25px);font-weight:800;color:#4c351b;margin:.4rem 0 1rem}
#name{width:80%;padding:.8rem 1rem;border:4px solid #49bfff;border-radius:20px;font-weight:900;font-size:clamp(20px,2vw,34px);text-align:center;outline:none}
.avatarTitle{font-weight:1000;color:#6d330e;font-size:clamp(17px,1.5vw,26px);margin:1rem 0 .5rem}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:2%}
.avatar{position:relative;border:5px solid transparent;border-radius:22px;background:white;padding:0;overflow:hidden;aspect-ratio:1/1}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.selected{border-color:#29ce55;box-shadow:0 0 0 5px white,0 0 0 9px #29ce55}
.avatar .check{display:none;position:absolute;right:5px;top:5px;width:32px;height:32px;border-radius:50%;background:#29ce55;color:#fff;font-weight:1000;align-items:center;justify-content:center;border:3px solid white}.avatar.selected .check{display:flex}
.start{margin-top:1rem;border:5px solid white;border-radius:28px;background:linear-gradient(#5be51d,#16a900);color:white;font-weight:1000;font-size:clamp(24px,2.7vw,44px);padding:.6rem 3rem;box-shadow:0 7px 0 #087d00}
.toast{position:absolute;z-index:50;left:50%;bottom:5%;transform:translateX(-50%);background:#082b55;color:white;padding:.8rem 1.4rem;border-radius:18px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.top{position:absolute;z-index:20;left:1.2%;right:1.2%;top:1.5%;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}.back,.music{border:4px solid white;background:linear-gradient(#ffbd25,#ff9415);color:white;border-radius:20px;box-shadow:0 5px 0 #b75a0b;font-weight:1000}.back{width:68px;height:62px;font-size:38px}.music{width:66px;height:62px;font-size:28px}
.stats{display:flex;gap:.6rem;align-items:center}.pill{background:rgba(255,255,255,.95);border:3px solid white;border-radius:20px;padding:.55rem .9rem;font-weight:1000;color:#07366b;font-size:clamp(15px,1.4vw,24px)}
#map .bg{object-fit:cover}.mapBtns{position:absolute;inset:0}.world{position:absolute;border:0;background:transparent;width:18%;height:13%;font-size:0}.world.unlocked{cursor:pointer}.world.locked{cursor:not-allowed}
.w1{left:11%;top:46%}.w2{left:40%;top:51%}.w3{left:67%;top:79%}.w4{left:38%;top:80%}.w5{left:72%;top:44%}
.stageBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none}
.stageShade{position:absolute;inset:0;background:rgba(0,25,50,.05)}
.stageTitle{position:absolute;z-index:5;top:2.5%;left:50%;transform:translateX(-50%);background:#a94f17;color:white;border:4px solid #efaa48;border-radius:18px;padding:.45rem 2rem;font-weight:1000;font-size:clamp(20px,2.3vw,38px);white-space:nowrap}
.activity{position:absolute;z-index:8;left:18%;right:5%;top:18%;bottom:5%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prompt{background:rgba(255,255,255,.97);border:4px solid #55c6ff;border-radius:25px;padding:.6rem 1.4rem;font-weight:1000;color:#07366b;font-size:clamp(20px,2.1vw,36px);text-align:center;max-width:80%;margin-bottom:2.2%}
.pairs{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:5%;max-width:920px}
.pair{height:min(43vh,370px);border:7px solid #d69a36;border-radius:50px;background:radial-gradient(circle,#fff4c8,#e7b85e);box-shadow:0 10px 0 #8b531d;display:grid;grid-template-columns:35% 65%;grid-template-rows:76% 24%;align-items:center;justify-items:center;padding:4%;overflow:hidden}
.pair .letter{font-size:clamp(70px,9vw,145px);font-weight:1000;color:#164c9c;text-shadow:0 4px white}
.pair img{width:94%;height:94%;object-fit:contain;filter:none}
.pair .word{grid-column:1/3;background:#ffc85b;border:4px solid #9b5a20;border-radius:15px;padding:.25rem 1rem;font-size:clamp(18px,1.8vw,30px);font-weight:1000;color:#4a240c}
.pair.correctFlash{outline:10px solid #2bd352}.pair.wrongFlash{animation:shake .18s 2}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pageIn{animation:pageIn .45s ease both}@keyframes pageIn{from{opacity:0;transform:translateX(7%)}to{opacity:1;transform:none}}
.pageOut{animation:pageOut .4s ease both}@keyframes pageOut{to{opacity:0;transform:translateX(-7%)}}
.generic{width:min(900px,92%);background:rgba(255,255,255,.96);border:4px solid #55c6ff;border-radius:28px;padding:2rem;text-align:center}
.generic .visual{font-size:clamp(55px,8vw,120px);margin:1rem}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.ans{padding:1rem;border:4px solid #c9a4ff;border-radius:20px;background:white;font-size:clamp(20px,2vw,34px);font-weight:1000}
@media(max-width:800px){#setupPanel{left:8%;width:84%;top:12%}.activity{left:5%;right:5%}.pairs{gap:3%}.pair{border-radius:28px}.stageTitle{top:9%}}

.f1page{width:100%;display:flex;flex-direction:column;align-items:center}.targetLetter{display:inline-block;background:#ffbf2e;color:#083e84;border:3px solid #c97910;border-radius:14px;padding:0 .35em}
.f1Choices{width:min(900px,94%);display:grid;grid-template-columns:repeat(2,1fr);gap:7%}.f1Choice{height:min(45vh,390px);border:7px solid #d69a36;border-radius:50px;background:radial-gradient(circle,#fff7d9,#e8b85f);box-shadow:0 10px 0 #8b531d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4%}.f1Choice img{width:80%;height:72%;object-fit:contain;filter:none}.f1Choice span{background:#ffc85b;border:4px solid #9b5a20;border-radius:15px;padding:.25rem 1.2rem;font-size:clamp(20px,2vw,34px);font-weight:1000;color:#4a240c}.questionImg{width:min(250px,35vw);height:min(210px,25vh);object-fit:contain;display:block;margin:.5rem auto 1rem;filter:none}

</style>
</head>
<body><div id="game">
<section id="setup" class="screen on">
 <img class="bg" src="assets/tela_inicial_hd.jpg"><div class="overlay"></div>
 <div id="setupPanel" class="card">
  <div class="logo">AVENTURA DO ALFABETO</div><div class="sub">Explore mundos, supere desafios e descubra letras, sílabas e palavras!</div>
  <input id="name" autocomplete="off" placeholder="Digite seu nome">
  <div class="avatarTitle">ESCOLHA SEU PERSONAGEM</div>
  <div class="avatars">
   <button class="avatar" data-av="1"><img src="assets/avatar1.webp"><span class="check">✓</span></button>
   <button class="avatar" data-av="2"><img src="assets/avatar2.webp"><span class="check">✓</span></button>
   <button class="avatar" data-av="3"><img src="assets/avatar3.webp"><span class="check">✓</span></button>
   <button class="avatar" data-av="4"><img src="assets/avatar4.webp"><span class="check">✓</span></button>
  </div>
  <button id="start" class="start">▶ COMEÇAR</button>
 </div>
</section>

<section id="map" class="screen"><img class="bg" src="assets/mapa_profissional.png">
 <div class="top"><button class="back" data-go="setup">←</button><div class="stats"><div class="pill" id="mapName">Aventureiro</div><div class="pill">⭐ <span id="mapStars">0</span></div><button class="music">🎵</button></div></div>
 <div class="mapBtns"><button class="world w1" data-world="1"></button><button class="world w2" data-world="2"></button><button class="world w3" data-world="3"></button><button class="world w4" data-world="4"></button><button class="world w5" data-world="5"></button></div>
</section>

<section id="stage" class="screen"><img id="stageBg" class="stageBg"><div class="stageShade"></div>
 <div class="top"><button class="back" data-go="map">←</button><div class="stats"><div class="pill" id="stageName"></div><div class="pill">⭐ <span id="stageStars">0</span> • <span id="count">1/5</span></div><button class="music">🎵</button></div></div>
 <div class="stageTitle" id="stageTitle"></div><div class="activity" id="activity"></div>
</section>
<div id="toast" class="toast"></div>
</div>
<script>
const S={name:"",avatar:0,world:1,q:0,stars:0,unlocked:1,music:false};
const A={
 A:{word:"ABELHA",img:"assets/fase1_obj_A.png"},
 E:{word:"ELEFANTE",img:"assets/fase1_obj_E.png"},
 I:{word:"IGREJA",img:"assets/igreja.svg"},
 O:{word:"OLHO",img:"assets/fase1_obj_O.png"},
 U:{word:"UVA",img:"assets/fase1_obj_U.png"}
};
// EXATAMENTE DUAS alternativas por tela; UMA correta.
// 1 A-Abelha correta / E-Igreja errada
// 2 A-Igreja errada / E-Elefante correta
// 3 I-Igreja correta / O-Abelha errada
// 4 O-Olho correta / U-Elefante errada
// 5 A-Uva errada / U-Uva correta
const F1=[
 {letter:"A",opts:["A","I"],correct:0},
 {letter:"E",opts:["I","E"],correct:1},
 {letter:"I",opts:["I","O"],correct:0},
 {letter:"O",opts:["U","O"],correct:1},
 {letter:"U",opts:["E","U"],correct:1}
];
const generic={
2:{title:"VILA DOS SONS",bg:"assets/vila_hd.jpg",qs:[
["Qual palavra começa com B?","assets/bola.svg",["BOLA","GATO","PATO"],0],["Qual palavra começa com C?","assets/casa.svg",["MALA","CASA","PATO"],1],["Qual palavra começa com G?","assets/gato.svg",["PATO","GATO","BOLA"],1],["Qual palavra começa com P?","assets/pato.svg",["PATO","MALA","CASA"],0],["Qual palavra começa com M?","assets/mala.svg",["CASA","MALA","GATO"],1]]},
3:{title:"MONTANHA DAS SÍLABAS",bg:"assets/montanha.webp",qs:[
["Qual é a primeira sílaba de BOLA?","assets/bola.svg",["BO","LA","BA"],0],["Qual é a primeira sílaba de CASA?","assets/casa.svg",["SA","CA","CO"],1],["Qual é a primeira sílaba de PATO?","assets/pato.svg",["PA","TO","PO"],0],["Qual é a primeira sílaba de MALA?","assets/mala.svg",["LA","MA","ME"],1],["Qual é a primeira sílaba de GATO?","assets/gato.svg",["GA","TO","GO"],0]]},
4:{title:"CASTELO DAS SÍLABAS",bg:"assets/castelo_silabas.webp",qs:[
["Qual combinação forma BOLA?","assets/bola.svg",["BO + LA","BA + LO","BI + LA"],0],["Qual combinação forma CASA?","assets/casa.svg",["CO + SA","CA + SA","CA + SO"],1],["Qual combinação forma PATO?","assets/pato.svg",["PA + TO","PE + TO","PO + TA"],0],["Qual combinação forma MALA?","assets/mala.svg",["ME + LA","MA + LA","MO + LE"],1],["Qual combinação forma GATO?","assets/gato.svg",["GA + TO","GO + TA","GU + TO"],0]]},
5:{title:"CASTELO DAS PALAVRAS",bg:"assets/castelo_palavras.webp",qs:[
["Complete: G_TO","assets/gato.svg",["A","E","I"],0],["Complete: C_SA","assets/casa.svg",["A","O","U"],0],["Complete: B_LA","assets/bola.svg",["A","O","U"],1],["Complete: P_TO","assets/pato.svg",["A","E","I"],0],["Complete: M_LA","assets/mala.svg",["A","E","O"],0]]}};
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1000)}
document.querySelectorAll(".avatar").forEach(b=>b.addEventListener("click",()=>{
 S.avatar=+b.dataset.av;document.querySelectorAll(".avatar").forEach(x=>x.classList.toggle("selected",x===b));toast("✓ Personagem escolhido!");
}));
document.getElementById("start").addEventListener("click",()=>{
 const n=document.getElementById("name").value.trim();
 if(!n)return toast("Digite seu nome.");
 if(!S.avatar)return toast("Escolha um personagem.");
 S.name=n;document.getElementById("mapName").textContent=n;document.getElementById("stageName").textContent=n;updateMap();show("map");
});
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.go)));
document.querySelectorAll(".world").forEach(b=>b.addEventListener("click",()=>{let w=+b.dataset.world;if(w>S.unlocked)return toast("🔒 Complete a fase anterior.");openWorld(w)}));
function updateMap(){document.getElementById("mapStars").textContent=S.stars;document.querySelectorAll(".world").forEach(b=>{let w=+b.dataset.world;b.classList.toggle("locked",w>S.unlocked);b.classList.toggle("unlocked",w<=S.unlocked)})}
function openWorld(w){S.world=w;S.q=0;document.getElementById("stageStars").textContent=S.stars;if(w===1){document.getElementById("stageTitle").textContent="FLORESTA DAS VOGAIS";document.getElementById("stageBg").src="assets/floresta_profissional.png"}else{document.getElementById("stageTitle").textContent=generic[w].title;document.getElementById("stageBg").src=generic[w].bg}show("stage");render()}
function render(){if(S.world===1)return renderF1();return renderGeneric()}
function renderF1(){
 const q=F1[S.q];document.getElementById("count").textContent=`${S.q+1}/5`;
 let h=`<div class="f1page pageIn"><div class="prompt">ATIVIDADE ${S.q+1} DE 5<br>Qual imagem começa com a letra <span class="targetLetter">${q.letter}</span>?</div><div class="f1Choices">`;
 q.opts.forEach((key,i)=>{const item=A[key];h+=`<button class="f1Choice" data-i="${i}"><img src="${item.img}" alt="${item.word}"><span>${item.word}</span></button>`});
 h+=`</div></div>`;document.getElementById("activity").innerHTML=h;
 document.querySelectorAll(".f1Choice").forEach(x=>x.onclick=()=>answerF1(x,+x.dataset.i));
}
function answerF1(btn,i){
 const q=F1[S.q];if(document.querySelector(".f1Choice[data-locked='1']"))return;
 if(i!==q.correct){btn.classList.add("wrongFlash");toast("Tente outra vez.");setTimeout(()=>btn.classList.remove("wrongFlash"),450);return}
 document.querySelectorAll(".f1Choice").forEach(x=>x.dataset.locked="1");btn.classList.add("correctFlash");S.stars++;document.getElementById("stageStars").textContent=S.stars;toast("⭐ Muito bem!");
 const pg=document.querySelector(".f1page");setTimeout(()=>pg&&pg.classList.add("pageOut"),300);
 setTimeout(()=>{S.q++;if(S.q>=5){S.unlocked=Math.max(S.unlocked,2);updateMap();setTimeout(()=>openWorld(2),500)}else renderF1()},800);
}
function renderGeneric(){
 const g=generic[S.world],q=g.qs[S.q];document.getElementById("count").textContent=`${S.q+1}/${g.qs.length}`;
 document.getElementById("activity").innerHTML=`<div class="generic pageIn"><div class="prompt">${q[0]}</div><img class="questionImg" src="${q[1]}" alt=""><div class="answers">${q[2].map((x,i)=>`<button class="ans" data-i="${i}">${x}</button>`).join("")}</div></div>`;
 document.querySelectorAll(".ans").forEach(b=>b.addEventListener("click",()=>answerGeneric(+b.dataset.i,b)));
}
function answerGeneric(i,b){
 const g=generic[S.world],q=g.qs[S.q];if(i!==q[3]){b.classList.add("wrongFlash");toast("Tente outra vez.");return}
 S.stars++;document.getElementById("stageStars").textContent=S.stars;toast("⭐ Muito bem!");S.q++;
 setTimeout(()=>{if(S.q>=g.qs.length){if(S.world<5){S.unlocked=Math.max(S.unlocked,S.world+1);updateMap();openWorld(S.world+1)}else{toast("🏆 Guardião das Palavras!");show("map")}}else renderGeneric()},650)
}
</script></body></html>
