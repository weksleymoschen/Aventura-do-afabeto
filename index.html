<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Aventura do Alfabeto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#092f3c;font-family:"Trebuchet MS",Arial,sans-serif;color:#40230e;overflow-x:hidden}button,input{font:inherit}
.app{max-width:1536px;margin:auto;min-height:100vh;background:#c9f4ff}.scene{position:relative;width:100%;aspect-ratio:3/2;background:url("assets/mundo.png") center/cover no-repeat;overflow:hidden}
.start-ui{position:absolute;inset:0}.avatar-hit{position:absolute;bottom:3.6%;height:25%;width:10.5%;border:5px solid transparent;border-radius:24px;background:transparent;cursor:pointer}.avatar-hit.sel{border-color:#ffe34d;box-shadow:0 0 0 5px #fff,0 0 25px #ff9b21}.a1{left:3.3%}.a2{left:14.4%}.a3{left:25.4%}.a4{left:36.5%}.a5{left:47.5%}.a6{left:58.6%}
#name{position:absolute;right:5.8%;bottom:13.4%;width:22.6%;height:6.2%;border:0;border-radius:18px;background:#fffdf4;text-align:center;font-size:clamp(13px,1.6vw,26px);font-weight:800;color:#56331d;outline:4px solid transparent}#name:focus{outline-color:#ffcf3c}
#play{position:absolute;right:4.2%;bottom:2.8%;width:26%;height:9.3%;border:0;border-radius:28px;background:transparent;cursor:pointer}
.warn{position:absolute;right:5%;bottom:23%;background:#fff;border:3px solid #ffbf2f;border-radius:18px;padding:8px 15px;font-weight:900;display:none}
.game{display:none;min-height:100vh;background:linear-gradient(#6ed4ff,#d7f8ff 38%,#7ed66c)}.top{height:74px;background:linear-gradient(#fffdf0,#f7e3b0);border-bottom:5px solid #a86827;display:flex;align-items:center;gap:12px;padding:8px 14px;position:relative;z-index:20}.badge{background:#fff;border:3px solid #e1ad53;border-radius:18px;padding:8px 13px;font-weight:900}.bar{flex:1;height:20px;background:#fff;border:3px solid #d59b43;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69d76c,#ffe448);transition:.35s}.round{position:relative;min-height:calc(100vh - 74px);overflow:hidden;background:url("assets/mundo.png") center/cover no-repeat}.round:before{content:"";position:absolute;inset:0;background:#ffffff12}
.task{position:absolute;z-index:10;left:50%;top:3%;transform:translateX(-50%);min-width:min(650px,88%);background:linear-gradient(#fffef6,#ffe8a9);border:5px solid #fff;border-radius:28px;box-shadow:0 8px 0 #9a642c,0 15px 30px #0003;padding:12px 20px;text-align:center;font-weight:1000;font-size:clamp(18px,2.2vw,34px)}.task strong{color:#f14f3e;font-size:1.35em}
.choice{position:absolute;z-index:9;border:6px solid #fff;border-radius:25px;box-shadow:0 7px 0 #74491e,0 10px 18px #0002;min-width:90px;min-height:78px;font-weight:1000;font-size:clamp(28px,4vw,58px);cursor:pointer;transition:.15s}.choice:hover{transform:scale(1.07)}.choice:active{transform:translateY(5px);box-shadow:0 2px 0 #74491e}.c1{background:#5dd3ff}.c2{background:#ff7694}.c3{background:#8be66d}.c4{background:#ffd64c}.c5{background:#b78cff}
.pic{font-size:clamp(48px,7vw,100px);background:#fff8;border-radius:30px;padding:8px 16px}.feedback{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;background:#fff9dd;border:7px solid white;border-radius:32px;box-shadow:0 15px 50px #0005;padding:20px 35px;font-size:clamp(28px,5vw,64px);font-weight:1000;pointer-events:none;transition:.2s}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.conf{position:fixed;top:-20px;width:12px;height:22px;z-index:100;animation:fall 1.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}.finish{display:none;min-height:100vh;background:url("assets/mundo.png") center/cover no-repeat;padding:7vh 18px}.finishbox{max-width:720px;margin:auto;text-align:center;background:#fffbe7ee;border:7px solid #fff;border-radius:38px;padding:30px;box-shadow:0 15px 50px #0004}.finishbox h1{font-size:clamp(35px,7vw,72px);margin:0;color:#ef5b3e;text-shadow:0 3px #fff}.finishbox .cup{font-size:100px}.green{border:0;border-radius:22px;background:linear-gradient(#78ef2f,#45c810);box-shadow:0 7px 0 #278b0b;color:#173900;padding:15px 30px;font-size:25px;font-weight:1000;cursor:pointer}
@media(max-width:700px){.scene{aspect-ratio:3/2;min-height:620px;background-size:cover;background-position:center}.avatar-hit{bottom:4%;height:23%}#name{bottom:14%;font-size:13px}.top{height:auto;min-height:66px}.round{min-height:720px}.choice{min-width:70px;min-height:65px}}

.ill{width:120px;height:120px;background:#fff;border:6px solid #fff;border-radius:30px;display:flex;align-items:center;justify-content:center;padding:8px}
.ill svg{width:100%;height:100%}
</style></head><body><main class="app">
<section id="start" class="scene"><div class="start-ui"><button class="avatar-hit a1 sel" aria-label="Avatar 1"></button><button class="avatar-hit a2" aria-label="Avatar 2"></button><button class="avatar-hit a3" aria-label="Avatar 3"></button><button class="avatar-hit a4" aria-label="Avatar 4"></button><button class="avatar-hit a5" aria-label="Avatar 5"></button><button class="avatar-hit a6" aria-label="Avatar 6"></button><input id="name" maxlength="14" placeholder="Digite seu nome"><button id="play" aria-label="Jogar"></button><div id="warn" class="warn">Digite seu nome 😊</div></div></section>
<section id="game" class="game"><header class="top"><span class="badge">⭐ <b id="stars">0</b></span><span class="badge" id="chosenAvatar" style="width:54px;height:54px;padding:2px;overflow:hidden"></span><span class="badge" id="player">AVENTUREIRO</span><div class="bar"><i id="progress"></i></div><button id="sound" class="badge" aria-label="Música">🔊</button><button id="home" class="badge" aria-label="Início">🏠</button></header><div id="round" class="round"></div></section>
<section id="finish" class="finish"><div class="finishbox"><div class="cup">🏆</div><h1>PARABÉNS!</h1><h2 id="winner"></h2><p style="font-size:26px">Você completou a Aventura do Alfabeto!</p><p style="font-size:40px">⭐⭐⭐⭐⭐</p><button id="again" class="green">JOGAR NOVAMENTE</button></div></section>
<div id="feedback" class="feedback"></div></main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let avatar=0,level=0,score=0,audio=null,music=true;
$$('.avatar-hit').forEach((b,i)=>b.onclick=()=>{avatar=i;$$('.avatar-hit').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
$('#play').onclick=()=>{let n=$('#name').value.trim();if(!n){$('#warn').style.display='block';return}$('#warn').style.display='none';$('#player').textContent=n.toUpperCase();$('#chosenAvatar').innerHTML=avatarSvg(avatar);$('#start').style.display='none';$('#game').style.display='block';level=0;score=0;render();startMusic()};
$('#home').onclick=()=>{stopMusic();$('#game').style.display='none';$('#start').style.display='block'};$('#again').onclick=()=>{$('#finish').style.display='none';$('#start').style.display='block'};
$('#sound').onclick=()=>{music=!music;$('#sound').textContent=music?'🔊':'🔇';music?startMusic():stopMusic()};

function avatarSvg(i){
 const skin=['#f1b38b','#f0b58f','#8c573d','#f0c29f','#e1a27c','#a96f50'][i];
 const hair=['#513323','#6b3c27','#241a18','#d89b34','#161313','#3b261d'][i];
 const shirt=['#55a9e8','#ef6d8b','#65be72','#8569d9','#ef6461','#f0a43b'][i];
 return `<svg viewBox="0 0 100 120" style="width:100%;height:100%" aria-label="Avatar escolhido"><circle cx="50" cy="33" r="23" fill="${skin}"/><path d="M25 35Q26 7 51 9Q78 10 76 40Q62 22 29 28" fill="${hair}"/><circle cx="42" cy="34" r="2.5"/><circle cx="59" cy="34" r="2.5"/><path d="M43 45Q50 51 58 45" fill="none" stroke="#8d4b42" stroke-width="2.5"/><rect x="30" y="58" width="41" height="43" rx="14" fill="${shirt}"/><path d="M40 98L36 117M61 98L65 117" stroke="#36506b" stroke-width="11"/></svg>`}

function startMusic(){if(audio||!music)return;try{audio=new(window.AudioContext||window.webkitAudioContext)();let g=audio.createGain();g.gain.value=.018;g.connect(audio.destination);let ns=[261.6,329.6,392,523.2,392,349.2,329.6,293.7],t=audio.currentTime;for(let i=0;i<120;i++){let o=audio.createOscillator();o.type='triangle';o.frequency.value=ns[i%ns.length];o.connect(g);o.start(t+i*.28);o.stop(t+i*.28+.18)}}catch(e){}}
function stopMusic(){if(audio){try{audio.close()}catch(e){}audio=null}}
function pop(ok,text){let f=$('#feedback');f.textContent=text;f.classList.add('show');if(ok)confetti();setTimeout(()=>f.classList.remove('show'),650)}
function confetti(){let cs=['#ff5e55','#ffd83e','#55cc66','#55bfff','#bd78ef'];for(let i=0;i<32;i++){let c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=cs[i%cs.length];c.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}}
function win(){score++;$('#stars').textContent=score;pop(true,'⭐ MUITO BEM!');setTimeout(()=>{level++;$('#progress').style.width=(level/5*100)+'%';if(level===5)finish();else render()},800)}
function wrong(){pop(false,'💛 TENTE OUTRA!')}
function btn(text,cls,x,y,ok){let b=document.createElement('button');b.className='choice '+cls;b.textContent=text;b.style.left=x+'%';b.style.top=y+'%';b.onclick=ok?win:wrong;$('#round').appendChild(b)}
function task(t){$('#round').innerHTML='<div class="task">'+t+'</div>'}

const art={ball:`<svg viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='#fff' stroke='#273746' stroke-width='4'/><polygon points='50,27 64,38 59,55 41,55 36,38' fill='#273746'/><path d='M36 38L20 32M64 38L80 32M59 55L70 73M41 55L30 73M50 27L50 12' stroke='#273746' stroke-width='4'/></svg>`,cat:`<svg viewBox='0 0 100 100'><path d='M25 34L18 12L39 26M75 34L82 12L61 26' fill='#f39b35' stroke='#8a4b22' stroke-width='3'/><circle cx='50' cy='52' r='32' fill='#f5a33d' stroke='#8a4b22' stroke-width='3'/><circle cx='39' cy='49' r='4'/><circle cx='61' cy='49' r='4'/><path d='M47 59L53 59L50 64Z' fill='#d86b72'/><path d='M50 64Q43 71 38 65M50 64Q57 71 62 65' fill='none' stroke='#6b3d2a' stroke-width='3'/></svg>`,orange:`<svg viewBox='0 0 100 100'><circle cx='49' cy='57' r='34' fill='#ff9e1b' stroke='#df7411' stroke-width='4'/><path d='M51 24Q61 8 78 18Q67 31 51 28' fill='#4fae45'/><path d='M50 25Q49 16 53 10' stroke='#5f7136' stroke-width='4'/></svg>`,house:`<svg viewBox='0 0 100 100'><path d='M13 45L50 15L87 45' fill='#e85c4b' stroke='#8d4032' stroke-width='4'/><rect x='21' y='43' width='58' height='45' rx='3' fill='#ffe09b' stroke='#9c6b38' stroke-width='4'/><rect x='43' y='59' width='17' height='29' fill='#9b633d'/><rect x='27' y='55' width='12' height='13' fill='#67c8e9'/></svg>`,monkey:`<svg viewBox='0 0 100 100'><circle cx='25' cy='45' r='14' fill='#9a5b2d'/><circle cx='75' cy='45' r='14' fill='#9a5b2d'/><circle cx='50' cy='50' r='34' fill='#8b4f29'/><ellipse cx='50' cy='59' rx='23' ry='20' fill='#e6b37d'/><circle cx='40' cy='45' r='4'/><circle cx='60' cy='45' r='4'/><path d='M40 66Q50 74 60 66' fill='none' stroke='#6b3824' stroke-width='3'/></svg>`};
function picBtn(kind,x,y,ok,label){let b=document.createElement('button');b.className='choice ill';b.innerHTML=art[kind];b.setAttribute('aria-label',label);b.style.left=x+'%';b.style.top=y+'%';b.onclick=ok?win:wrong;$('#round').appendChild(b)}

function render(){if(level===0){task('ENCONTRE A LETRA <strong>A</strong>');btn('M','c4',16,35,0);btn('A','c2',43,48,1);btn('O','c1',72,31,0);btn('E','c3',26,68,0);btn('U','c5',67,70,0)}
if(level===1){task('QUAL COMEÇA COM <strong>BO</strong>?');picBtn('ball',18,48,1,'bola');picBtn('cat',44,52,0,'gato');picBtn('orange',70,47,0,'laranja')}
if(level===2){task('QUAL COMEÇA COM <strong>GA</strong>?');picBtn('house',16,48,0,'casa');picBtn('cat',43,52,1,'gato');picBtn('ball',70,48,0,'bola')}
if(level===3){task('TOQUE NAS LETRAS DE <strong>BOLA</strong>');sequence()}
if(level===4){task('DESAFIO FINAL — ENCONTRE <strong>M</strong>');btn('N','c2',20,40,0);btn('M','c3',46,56,1);btn('W','c4',72,38,0)}}
function sequence(){let word='BOLA',p=0;let xs=[14,27,40,53,66,79],letters=['B','O','L','A','M','S'];letters.forEach((l,i)=>{let b=document.createElement('button');b.className='choice '+['c1','c4','c3','c2','c5','c1'][i];b.textContent=l;b.style.left=xs[i]+'%';b.style.top=(i%2?58:45)+'%';b.onclick=()=>{if(l===word[p]){p++;pop(true,'⭐ '+word.slice(0,p));b.style.visibility='hidden';if(p===4)setTimeout(()=>win(),600)}else wrong()};$('#round').appendChild(b)})}
function finish(){stopMusic();$('#game').style.display='none';$('#winner').textContent=$('#name').value.trim().toUpperCase();$('#finish').style.display='block';confetti()}
</script></body></html>
