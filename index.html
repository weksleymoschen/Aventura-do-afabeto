<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Aventura do Alfabeto — WM Jogos Educativos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#073d60;font-family:Arial,sans-serif}button,input{font:inherit}.screen{display:none;position:fixed;inset:0}.screen.on{display:block}.frame{position:absolute;left:50%;top:50%;width:min(100vw,120vh);height:min(100vh,83.3333vw);transform:translate(-50%,-50%);overflow:hidden;background:#073d60}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none}.hot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hot:focus-visible{outline:5px solid #fff;box-shadow:0 0 0 10px #35d05b}.name{position:absolute;z-index:6;left:19.66%;top:40.31%;width:58.20%;height:8.13%;border:0;outline:0;background:#fff;text-align:center;color:#15396e;font-size:clamp(17px,2.2vw,35px);font-weight:900;border-radius:22px;padding:0 2%;box-shadow:none}.name::placeholder{color:#777}.avatars{position:absolute;z-index:6;left:6.38%;top:56.72%;width:86.20%;height:25.63%;display:grid;grid-template-columns:19.4% 19.5% 19.6% 19.7%;column-gap:1.7%;justify-content:space-between}.avatar{border:0;background:transparent;border-radius:22px;cursor:pointer;touch-action:manipulation;overflow:hidden}.avatar.sel{outline:6px solid #31d05a;outline-offset:-8px;box-shadow:inset 0 0 0 3px #fff8}.start{left:23.83%;top:82.81%;width:52.47%;height:13.75%;border-radius:60px}.hint{position:absolute;z-index:10;left:30%;right:30%;bottom:2%;padding:8px;background:#003d76e8;color:#fff;text-align:center;border-radius:15px;font-weight:900;opacity:0}.hint.show{opacity:1}.hud{position:absolute;z-index:20;right:1.5%;top:1.5%;display:flex;gap:7px}.pill,.sound{border:3px solid #fff;background:#0b84d4;color:#fff;border-radius:18px;padding:8px 13px;font-weight:900}.sound{cursor:pointer}.maphot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:20px}.maphot:hover{box-shadow:0 0 0 6px #fff9,0 0 30px #ffe52b}.maphot.lock{cursor:not-allowed}.maphot.done:after{content:"✓";position:absolute;right:-3%;top:-12%;width:28%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#2ed05a;color:#fff;border:4px solid #fff;font-size:clamp(15px,2vw,30px);font-weight:1000}.stageFrame{position:absolute;left:50%;top:50%;width:min(100vw,80vh);height:min(100vh,125vw);transform:translate(-50%,-50%);overflow:hidden;background:#075747}.stagebg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;filter:saturate(1.05);pointer-events:none;user-select:none}.veil{position:absolute;inset:0;background:#0002;pointer-events:none}.back{position:absolute;z-index:20;left:1.5%;top:2%;width:6%;aspect-ratio:1;border:4px solid white;border-radius:18px;background:#ffad18;color:#fff;font-size:clamp(22px,3vw,45px);font-weight:1000;cursor:pointer}.stageTitle{position:absolute;z-index:10;left:50%;top:2%;transform:translateX(-50%);background:linear-gradient(#ca7228,#913b10);border:4px solid #6d2c0b;border-radius:20px;padding:.7% 3%;color:white;font-size:clamp(17px,2.5vw,38px);font-weight:1000;white-space:nowrap;text-shadow:0 3px #4d1a06}.instruction{position:absolute;z-index:10;left:50%;top:14%;transform:translateX(-50%);width:68%;background:#fffef1;border:5px solid #4abcf3;border-radius:22px;padding:1%;text-align:center;color:#15396e;font-size:clamp(16px,2vw,30px);font-weight:1000}.challenge{position:absolute;z-index:10;left:50%;top:26%;transform:translateX(-50%);min-width:16%;background:#fff0bd;border:7px solid #a55d1b;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;color:#184da0;font-size:clamp(45px,8vw,125px);font-weight:1000;box-shadow:0 8px #66350e}.choices{position:absolute;z-index:10;left:6%;right:6%;bottom:4%;height:28%;display:grid;grid-template-columns:repeat(4,1fr);gap:2%}.choice{position:relative;border:5px solid #50bce8;border-radius:20px;background:#fff;cursor:pointer;overflow:hidden;box-shadow:0 7px #116c9a;touch-action:manipulation}.choice img{width:100%;height:68%;object-fit:contain;pointer-events:none}.choice b{position:absolute;left:0;right:0;bottom:4%;text-align:center;color:#2a2a2a;font-size:clamp(12px,1.5vw,23px)}.choice.ok{border-color:#2ed05a;box-shadow:0 0 0 7px #2ed05a,0 7px #15782f}.choice.bad{animation:shake .28s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.feedback{position:absolute;z-index:40;left:50%;top:52%;transform:translate(-50%,-50%) scale(.5);opacity:0;background:#2ed05a;color:white;border:6px solid white;border-radius:28px;padding:2% 5%;font-size:clamp(24px,4vw,60px);font-weight:1000;transition:.18s;pointer-events:none}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.end{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#48c9ff,#4ebd58)}.endbox{width:min(720px,82%);background:#fffbea;border:8px solid #ffd63b;border-radius:32px;padding:35px;text-align:center;color:#15396e}.endbox h1{font-size:clamp(32px,5vw,70px);margin:0}.endbox button{border:0;border-radius:22px;background:#25bd36;color:white;padding:15px 30px;font-size:22px;font-weight:1000;cursor:pointer}

/* Correções globais aplicadas a TODAS as fases */
#setup,#map,#stage{background:#083d60}
.stageFrame{background:linear-gradient(135deg,#075747,#1497b6)}
.stageFrame:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#ffffff12,transparent 60%);pointer-events:none}
@media (orientation:landscape){
 .stageFrame{width:min(100vw,100vh);height:min(100vh,100vw)}
 .stagebg{object-fit:cover;opacity:.38;filter:blur(1px) saturate(1.15)}
 .veil{background:#003d4b55}
}
@media (max-width:700px){
 .name{font-size:clamp(15px,4vw,25px)}
 .avatar.sel{outline-width:4px;outline-offset:-5px}
}
</style></head><body>
<section id="setup" class="screen on"><div class="frame"><img class="bg" src="assets/capa.jpg"><input id="name" class="name" placeholder="Digite seu nome" maxlength="18" autocomplete="off"><div class="avatars"><button class="avatar" data-a="0"></button><button class="avatar" data-a="1"></button><button class="avatar" data-a="2"></button><button class="avatar" data-a="3"></button></div><button id="start" class="hot start" aria-label="Começar"></button><div id="hint" class="hint"></div></div></section>
<section id="map" class="screen"><div class="frame"><img class="bg" src="assets/mapa.jpg"><div class="hud"><span id="mapName" class="pill"></span><span id="stars" class="pill">⭐ 0/25</span><button class="sound">♫</button></div><div id="mapHot"></div></div></section>
<section id="stage" class="screen"><div class="stageFrame"><img id="stageBg" class="stagebg"><div class="veil"></div><button id="back" class="back">←</button><div id="stageTitle" class="stageTitle"></div><div class="hud"><span id="gameName" class="pill"></span><span id="progress" class="pill"></span><button class="sound">♫</button></div><div id="instruction" class="instruction"></div><div id="challenge" class="challenge"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback">MUITO BEM! ⭐</div></div></section>
<section id="end" class="screen"><div class="end"><div class="endbox"><h1>🏆 PARABÉNS!</h1><h2 id="winner"></h2><p>Você se tornou o Guardião das Palavras!</p><button id="again">JOGAR NOVAMENTE</button></div></div></section>
<script>
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const S={name:"",avatar:null,world:1,item:0,stars:0,unlocked:1,busy:false,sound:true,audio:null};
const worlds=["FLORESTA DAS VOGAIS","CASTELO DAS SÍLABAS","VILA DOS SONS","ILHA DAS LETRAS","MONTANHA DAS PALAVRAS"];
const data=[
 {inst:"Clique na imagem que começa com a letra:",qs:[["A","abelha","casa","arvore","banana"],["E","elefante","uva","olho","ilha"],["I","ilha","abelha","uva","olho"],["O","olho","ilha","elefante","uva"],["U","uva","olho","abelha","ilha"]]},
 {inst:"Clique na imagem que começa com a sílaba:",qs:[["CA","casa","cachorro","cavalo","colher"],["BO","bola","banana","casa","gato"],["GA","gato","casa","bola","mesa"],["MA","macaco","mesa","gato","bola"],["PA","pato","casa","gato","uva"]]},
 {inst:"Clique na imagem que tem o som inicial:",qs:[["M","macaco","bola","mesa","gato"],["B","bola","gato","uva","casa"],["G","gato","mesa","bola","uva"],["C","casa","bola","gato","uva"],["U","uva","gato","casa","bola"]]},
 {inst:"Clique na imagem que começa com a letra:",qs:[["U","uva","relogio","urso","igreja"],["R","relogio","uva","urso","igreja"],["I","igreja","urso","uva","relogio"],["U","urso","igreja","relogio","uva"],["A","abelha","igreja","uva","urso"]]},
 {inst:"Clique na imagem que corresponde à palavra:",qs:[["SOL","sol","lua","estrela","nuvem"],["LUA","lua","sol","estrela","nuvem"],["ESTRELA","estrela","lua","sol","nuvem"],["NUVEM","nuvem","sol","lua","estrela"],["CASA","casa","sol","lua","nuvem"]]}
];
const emoji={abelha:"🐝",casa:"🏠",arvore:"🌳",banana:"🍌",elefante:"🐘",uva:"🍇",olho:"👁️",ilha:"🏝️",cachorro:"🐶",cavalo:"🐴",colher:"🥄",bola:"⚽",gato:"🐱",mesa:"🪑",macaco:"🐵",pato:"🦆",relogio:"🕐",urso:"🐻",igreja:"⛪",sol:"☀️",lua:"🌙",estrela:"⭐",nuvem:"☁️"};
function show(id){$$(".screen").forEach(x=>x.classList.remove("on"));$("#"+id).classList.add("on")}
function hint(t){$("#hint").textContent=t;$("#hint").classList.add("show");setTimeout(()=>$("#hint").classList.remove("show"),1300)}
$$(".avatar").forEach(b=>b.onclick=()=>{$$(".avatar").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.avatar=+b.dataset.a});
$("#start").onclick=()=>{let n=$("#name").value.trim();if(!n)return hint("Digite seu nome.");if(S.avatar===null)return hint("Escolha seu personagem.");S.name=n;$("#mapName").textContent=n;$("#gameName").textContent=n;startMusic();renderMap();openWorld(1)};
function startMusic(){if(S.audio)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A(),g=c.createGain();g.gain.value=.035;g.connect(c.destination);let notes=[261.6,329.6,392,523.2,392,329.6],i=0;function play(){if(!S.sound){setTimeout(play,500);return}let o=c.createOscillator(),v=c.createGain();o.type="sine";o.frequency.value=notes[i++%notes.length];v.gain.setValueAtTime(.001,c.currentTime);v.gain.exponentialRampToValueAtTime(.12,c.currentTime+.03);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+.42);o.connect(v);v.connect(g);o.start();o.stop(c.currentTime+.45);setTimeout(play,500)}play();S.audio=c}
$$(".sound").forEach(b=>b.onclick=()=>{S.sound=!S.sound;$$(".sound").forEach(x=>x.textContent=S.sound?"♫":"♪")});
const spots=[[11,35,24,30],[51,25,25,32],[8,65,26,25],[50,67,26,25],[78,51,21,28]];
function renderMap(){let m=$("#mapHot");m.innerHTML="";worlds.forEach((w,i)=>{let n=i+1,b=document.createElement("button"),q=spots[i];b.className="maphot "+(n>S.unlocked?"lock ":"")+(n<S.unlocked?"done ":"");b.style.cssText=`left:${q[0]}%;top:${q[1]}%;width:${q[2]}%;height:${q[3]}%`;b.ariaLabel=w;if(n<=S.unlocked)b.onclick=()=>openWorld(n);m.appendChild(b)});$("#stars").textContent=`⭐ ${S.stars}/25`}
function openWorld(n){S.world=n;S.item=0;show("stage");$("#stageTitle").textContent=worlds[n-1];$("#stageBg").src=`assets/fase${n}.jpg`;renderActivity()}
function renderActivity(){S.busy=false;let d=data[S.world-1],q=d.qs[S.item];$("#instruction").textContent=d.inst;$("#challenge").textContent=q[0];$("#progress").textContent=`${S.item+1}/5`;let box=$("#choices");box.innerHTML="";q.slice(1).forEach((name,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<div style="height:68%;display:grid;place-items:center;font-size:clamp(45px,6vw,95px)">${emoji[name]||"❓"}</div><b>${name.toUpperCase()}</b>`;b.onclick=()=>answer(b,i===0);box.appendChild(b)})}
function answer(b,ok){if(S.busy)return;if(!ok){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);return}S.busy=true;b.classList.add("ok");$("#feedback").classList.add("show");setTimeout(()=>{$("#feedback").classList.remove("show");S.stars++;S.item++;if(S.item>=5){S.unlocked=Math.max(S.unlocked,S.world+1);if(S.world===5){$("#winner").textContent=S.name;show("end")}else openWorld(S.world+1)}else renderActivity()},650)}
$("#back").onclick=()=>{renderMap();show("map")};$("#again").onclick=()=>location.reload();$("#name").value="";
</script></body></html>
