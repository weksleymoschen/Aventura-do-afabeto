<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aventura do Alfabeto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#073c4b;font-family:Trebuchet MS,Arial,sans-serif;color:#40250e}button,input{font:inherit}.screen{display:none;min-height:100vh}.screen.on{display:block}
.start{position:relative;max-width:1536px;margin:auto;aspect-ratio:3/2;background:url(assets/inicio.png) center/cover no-repeat;overflow:hidden}.realinput{position:absolute;left:33.7%;top:42.2%;width:31.5%;height:7.3%;border:0;border-radius:19px;background:#fff;color:#52341e;text-align:center;font-size:clamp(14px,1.6vw,27px);font-weight:800;box-shadow:inset 0 0 0 3px #ddd;z-index:4}.realinput:focus{outline:5px solid #ffd43b}
.hit{position:absolute;top:59.3%;height:22.7%;width:12.4%;border:6px solid transparent;border-radius:28px;background:transparent;z-index:4}.hit.sel{border-color:#ffe33c;box-shadow:0 0 0 5px #fff,0 0 30px #ffb11f}.h1{left:9.7%}.h2{left:22.8%}.h3{left:35.9%}.h4{left:49.0%}.h5{left:62.1%}.h6{left:75.2%}.startplay{position:absolute;left:34%;bottom:2.4%;width:31.5%;height:11%;border:0;background:transparent;z-index:4}.warn{position:absolute;left:50%;top:50%;transform:translateX(-50%);z-index:8;background:#fff4c8;border:4px solid #f0a525;border-radius:18px;padding:10px 18px;font-weight:900;display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:7px 12px;background:linear-gradient(#fff8db,#f1d08d);border-bottom:5px solid #995d24}.avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #cf9140}.avatar svg{width:100%;height:100%}.name{font-weight:1000}.bar{flex:1;height:19px;background:#fff;border:3px solid #cb8e3c;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#58d265,#ffe247);transition:.35s}.pill{background:#fff;border:3px solid #d59b4d;border-radius:15px;padding:7px 10px;font-weight:900}.icon{border:0;background:#fff;border-radius:13px;padding:9px;font-size:20px}
.stage{min-height:calc(100vh - 72px);background:url(assets/cenario.png) center/cover;position:relative;padding:105px 18px 35px}.stage:before{content:"";position:absolute;inset:0;background:#ffffff18}.head{position:absolute;top:17px;left:50%;transform:translateX(-50%);z-index:4;min-width:min(820px,92%);text-align:center;background:linear-gradient(#fffbe4,#ffd574);border:5px solid #fff;border-radius:25px;box-shadow:0 7px 0 #845323;padding:9px 18px;font-size:clamp(18px,2.4vw,31px);font-weight:1000}.worldtag{display:block;font-size:.55em;color:#8a4d22}.card{position:relative;z-index:3;max-width:980px;margin:auto;background:#fffdf0f2;border:6px solid #fff;border-radius:32px;padding:22px;box-shadow:0 18px 50px #0003}.prompt{text-align:center;font-size:clamp(20px,3vw,34px);font-weight:1000;margin-bottom:18px}.target{font-size:1.5em;color:#ef533e}.options{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}.opt{min-width:105px;min-height:92px;border:5px solid #fff;border-radius:23px;background:linear-gradient(#85ddff,#48b8e7);box-shadow:0 7px 0 #2c7898;font-size:clamp(30px,4vw,55px);font-weight:1000;color:#263b4b;transition:.12s}.opt:nth-child(2n){background:linear-gradient(#ffb2c1,#ff7690);box-shadow:0 7px 0 #a13f54}.opt:nth-child(3n){background:linear-gradient(#b7ee91,#68cd56);box-shadow:0 7px 0 #388b2e}.opt:active{transform:translateY(5px);box-shadow:none}.photo{width:175px;height:155px;background:#fff;border:5px solid #eee;border-radius:24px;box-shadow:0 6px 14px #0002;display:flex;align-items:center;justify-content:center}.photo svg{width:94%;height:94%}.photo span{font-size:17px;font-weight:900;position:absolute;margin-top:125px;background:#fff;padding:2px 7px;border-radius:8px}.slots{display:flex;gap:8px;justify-content:center;margin:14px 0 20px}.slot{width:64px;height:70px;background:white;border:4px solid #c38b48;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:1000}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.map button{border:5px solid white;border-radius:25px;padding:20px 8px;min-height:145px;font-weight:1000;font-size:18px;color:#fff;box-shadow:0 7px 0 #0003}.map button:nth-child(1){background:#48b24d}.map button:nth-child(2){background:#e7593e}.map button:nth-child(3){background:#9c67dc}.map button:nth-child(4){background:#ed942e}.map button:nth-child(5){background:#3e8bd8}.map b{display:block;font-size:38px}.map small{display:block;margin-top:7px}.locked{filter:grayscale(.7);opacity:.65}

.transition{position:fixed;inset:0;z-index:90;background:url(assets/cenario.png) center/cover;display:none;align-items:center;justify-content:center;padding:20px}
.transition.show{display:flex}.transitionbox{width:min(1000px,96%);background:#fff8;border:7px solid #fff;border-radius:35px;padding:22px;box-shadow:0 20px 60px #0005;text-align:center}
.transitionbox h2{font-size:clamp(28px,5vw,55px);margin:0 0 14px;color:#6d3c18;text-shadow:0 2px #fff}
.phasecards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.phasecard{min-height:160px;border:5px solid #fff;border-radius:24px;padding:12px 6px;color:#fff;font-weight:1000;box-shadow:0 7px 0 #0003;display:flex;flex-direction:column;justify-content:center;align-items:center}.phasecard b{font-size:38px}.phasecard.active{outline:7px solid #ffe23c;transform:scale(1.04)}.phasecard.done:after{content:"✓";font-size:28px}.phasecard:nth-child(1){background:#48b24d}.phasecard:nth-child(2){background:#e7593e}.phasecard:nth-child(3){background:#9c67dc}.phasecard:nth-child(4){background:#ed942e}.phasecard:nth-child(5){background:#3e8bd8}.continue{margin-top:18px;border:5px solid white;border-radius:22px;background:linear-gradient(#79ec31,#3dbb14);box-shadow:0 7px 0 #257e10;padding:12px 30px;font-size:24px;font-weight:1000}
.assoc{display:flex;justify-content:center;align-items:center;gap:14px;margin:0 auto 20px;flex-wrap:wrap}.assoc .photo{width:145px;height:125px}.assocMark{font-size:42px;font-weight:1000;color:#ef533e}.assocText{min-width:90px;background:#fff;border:4px solid #e0a34e;border-radius:18px;padding:12px 18px;font-size:34px;font-weight:1000}
.feedback{position:fixed;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;background:#fff7c7;border:7px solid white;border-radius:30px;padding:20px 34px;font-size:clamp(28px,5vw,60px);font-weight:1000;box-shadow:0 20px 60px #0005;pointer-events:none;transition:.18s}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.conf{position:fixed;top:-20px;z-index:101;width:12px;height:21px;animation:fall 1.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(620deg)}}.finish{min-height:100vh;background:url(assets/cenario.png) center/cover;padding:7vh 20px}.finishbox{max-width:730px;margin:auto;background:#fffbe8ef;border:7px solid white;border-radius:36px;padding:30px;text-align:center;box-shadow:0 20px 60px #0004}.finishbox h1{font-size:clamp(40px,7vw,75px);color:#ee533d;margin:0}.green{border:5px solid white;border-radius:23px;background:linear-gradient(#79ec31,#3dbb14);box-shadow:0 8px 0 #257e10;padding:14px 28px;font-size:24px;font-weight:1000;color:#183c0b}
@media(max-width:720px){.start{min-height:650px;background-size:cover}.realinput{font-size:13px}.stage{padding-top:120px}.card{padding:14px}.map{grid-template-columns:1fr 1fr}.photo{width:135px;height:125px}.photo span{margin-top:100px}.opt{min-width:78px;min-height:70px}.top{flex-wrap:wrap}.bar{min-width:120px}}
</style></head><body>
<section id="start" class="screen on start"><input id="student" class="realinput" maxlength="14" placeholder="Digite seu nome aqui..."><button class="hit h1 sel" aria-label="Personagem 1"></button><button class="hit h2" aria-label="Personagem 2"></button><button class="hit h3" aria-label="Personagem 3"></button><button class="hit h4" aria-label="Personagem 4"></button><button class="hit h5" aria-label="Personagem 5"></button><button class="hit h6" aria-label="Personagem 6"></button><button id="startBtn" class="startplay" aria-label="Começar"></button><div id="warn" class="warn">DIGITE SEU NOME 😊</div></section>
<section id="game" class="screen"><header class="top"><div id="avatar" class="avatar"></div><span id="player" class="name"></span><div class="bar"><i id="bar"></i></div><span class="pill">⭐ <b id="score">0</b>/25</span><span class="pill" id="counter">1/25</span><button id="music" class="icon">🔊</button><button id="home" class="icon">🏠</button></header><main id="stage" class="stage"></main></section>
<section id="finish" class="screen finish"><div class="finishbox"><div style="font-size:100px">🏆</div><h1>PARABÉNS!</h1><h2 id="winner"></h2><p style="font-size:25px">VOCÊ COMPLETOU AS 5 FASES E AS 25 ATIVIDADES!</p><p style="font-size:42px">⭐⭐⭐⭐⭐</p><button id="again" class="green">JOGAR NOVAMENTE</button></div></section><div id="transition" class="transition"><div class="transitionbox"><h2 id="transitionTitle"></h2><div id="phasecards" class="phasecards"></div><button id="continuePhase" class="continue">COMEÇAR FASE ▶</button></div></div><div id="fb" class="feedback"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let avatar=0,idx=0,score=0,audio=null,musicOn=true;
const skin=['#f1b58c','#e8aa82','#855039','#efc09b','#d99670','#a76b4b'],hair=['#5b3823','#6f3f29','#211918','#d6a13e','#171516','#3b271d'],shirt=['#46a8e7','#ef6688','#5fbe68','#8d6adc','#ef654d','#efa43d'];
function person(i){return `<svg viewBox="0 0 100 120"><circle cx="50" cy="31" r="24" fill="${skin[i]}"/><path d="M25 33Q25 7 51 8Q80 9 76 40Q64 21 29 27" fill="${hair[i]}"/><circle cx="41" cy="33" r="3"/><circle cx="59" cy="33" r="3"/><path d="M42 45Q50 52 59 45" fill="none" stroke="#8b4c43" stroke-width="2.5"/><rect x="29" y="58" width="43" height="42" rx="15" fill="${shirt[i]}"/><path d="M39 98L36 119M61 98L65 119" stroke="#35516c" stroke-width="11"/></svg>`}
$$('.hit').forEach((b,i)=>b.onclick=()=>{avatar=i;$$('.hit').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
const art={
bola:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fafafa" stroke="#333" stroke-width="3"/><polygon points="50,26 64,37 59,54 41,54 36,37" fill="#222"/><path d="M36 37L20 31M64 37L80 31M59 54L71 72M41 54L29 72M50 26L50 10" stroke="#222" stroke-width="4"/></svg>`,
gato:`<svg viewBox="0 0 100 100"><path d="M23 35L17 10L40 27M77 35L83 10L60 27" fill="#d78b3a"/><ellipse cx="50" cy="54" rx="34" ry="32" fill="#e6a04e"/><ellipse cx="39" cy="50" rx="5" ry="7" fill="#63a866"/><ellipse cx="61" cy="50" rx="5" ry="7" fill="#63a866"/><path d="M46 61L54 61L50 67Z" fill="#df7f87"/><path d="M50 67Q42 75 36 68M50 67Q58 75 64 68" fill="none" stroke="#67402c" stroke-width="3"/></svg>`,
casa:`<svg viewBox="0 0 100 100"><path d="M10 46L50 14L90 46" fill="#e95d4c" stroke="#914033" stroke-width="4"/><rect x="20" y="44" width="60" height="44" fill="#ffe29e" stroke="#9a6b39" stroke-width="4"/><rect x="43" y="60" width="18" height="28" fill="#98603c"/><rect x="27" y="55" width="12" height="13" fill="#6dc9e9"/></svg>`,
pato:`<svg viewBox="0 0 100 100"><ellipse cx="45" cy="64" rx="32" ry="22" fill="#f2d63f"/><circle cx="65" cy="39" r="19" fill="#f2d63f"/><path d="M81 39L98 46L81 51Z" fill="#ed8b24"/><circle cx="70" cy="35" r="3"/></svg>`,
sapo:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="35" ry="25" fill="#59b956"/><circle cx="34" cy="38" r="14" fill="#65c861"/><circle cx="66" cy="38" r="14" fill="#65c861"/><circle cx="34" cy="36" r="5" fill="#fff"/><circle cx="66" cy="36" r="5" fill="#fff"/><circle cx="34" cy="36" r="2"/><circle cx="66" cy="36" r="2"/><path d="M37 66Q50 75 63 66" fill="none" stroke="#316e31" stroke-width="3"/></svg>`,
maca:`<svg viewBox="0 0 100 100"><path d="M51 24Q55 10 68 8" stroke="#65451f" stroke-width="5"/><path d="M54 19Q70 10 79 24Q64 32 53 26" fill="#55a943"/><path d="M50 25C20 10 12 45 20 70C28 94 49 88 50 84C53 90 76 94 83 68C91 38 75 13 50 25Z" fill="#e84238" stroke="#ad2927" stroke-width="3"/></svg>`,
mesa:`<svg viewBox="0 0 100 100"><rect x="14" y="30" width="72" height="18" rx="3" fill="#a96b3b"/><path d="M24 48L19 88M76 48L81 88" stroke="#7a4829" stroke-width="9"/></svg>`,
macaco:`<svg viewBox="0 0 100 100"><circle cx="24" cy="45" r="13" fill="#8a4f2b"/><circle cx="76" cy="45" r="13" fill="#8a4f2b"/><circle cx="50" cy="50" r="33" fill="#81502e"/><ellipse cx="50" cy="59" rx="22" ry="19" fill="#e5b37e"/><circle cx="40" cy="45" r="4"/><circle cx="60" cy="45" r="4"/><path d="M40 66Q50 74 60 66" fill="none" stroke="#61351f" stroke-width="3"/></svg>`,
dado:`<svg viewBox="0 0 100 100"><rect x="18" y="18" width="64" height="64" rx="10" fill="#fff" stroke="#e34f4a" stroke-width="7"/><circle cx="34" cy="34" r="5"/><circle cx="66" cy="34" r="5"/><circle cx="50" cy="50" r="5"/><circle cx="34" cy="66" r="5"/><circle cx="66" cy="66" r="5"/></svg>`,
flor:`<svg viewBox="0 0 100 100"><path d="M50 55V92" stroke="#4b9f45" stroke-width="7"/><g fill="#f05f8a"><circle cx="50" cy="32" r="17"/><circle cx="68" cy="46" r="17"/><circle cx="61" cy="67" r="17"/><circle cx="39" cy="67" r="17"/><circle cx="32" cy="46" r="17"/></g><circle cx="50" cy="50" r="14" fill="#ffd83f"/></svg>`
};
const phases=['FLORESTA DAS LETRAS','TREM DAS SÍLABAS','JARDIM DAS PALAVRAS','VILA DAS IMAGENS','GRANDE DESAFIO'];
const A=[
{p:'ENCONTRE A LETRA',t:'A',type:'letters',o:['A','E','B','O'],a:'A'},
{p:'ENCONTRE A LETRA',t:'M',type:'letters',o:['N','M','W','V'],a:'M'},
{p:'QUAL É IGUAL?',t:'B',type:'letters',o:['D','P','B','R'],a:'B'},
{p:'ENCONTRE A LETRA',t:'S',type:'letters',o:['C','G','S','Z'],a:'S'},
{p:'QUAL É IGUAL?',t:'P',type:'letters',o:['B','R','P','D'],a:'P'},
{p:'BOLA COMEÇA COM...',type:'syll',pic:'bola',o:['BA','BO','BI','BU'],a:'BO'},
{p:'GATO COMEÇA COM...',type:'syll',pic:'gato',o:['GO','GU','GA','GE'],a:'GA'},
{p:'CASA COMEÇA COM...',type:'syll',pic:'casa',o:['CO','CA','CU','CE'],a:'CA'},
{p:'PATO COMEÇA COM...',type:'syll',pic:'pato',o:['PI','PO','PA','PE'],a:'PA'},
{p:'SAPO COMEÇA COM...',type:'syll',pic:'sapo',o:['SE','SU','SO','SA'],a:'SA'},
{p:'COMPLETE A PALAVRA',type:'fill',word:'GATO',mask:'G_TO',o:['A','E','I','O'],a:'A'},
{p:'COMPLETE A PALAVRA',type:'fill',word:'BOLA',mask:'B_LA',o:['A','E','I','O'],a:'O'},
{p:'COMPLETE A PALAVRA',type:'fill',word:'CASA',mask:'CA_A',o:['S','M','P','T'],a:'S'},
{p:'COMPLETE A PALAVRA',type:'fill',word:'PATO',mask:'P_TO',o:['E','I','A','O'],a:'A'},
{p:'COMPLETE A PALAVRA',type:'fill',word:'SAPO',mask:'SA_O',o:['B','D','P','T'],a:'P'},
{p:'QUAL COMEÇA COM B?',type:'pics',o:['bola','gato','maca'],a:'bola'},
{p:'QUAL COMEÇA COM G?',type:'pics',o:['pato','gato','casa'],a:'gato'},
{p:'QUAL COMEÇA COM C?',type:'pics',o:['casa','sapo','bola'],a:'casa'},
{p:'QUAL COMEÇA COM P?',type:'pics',o:['flor','pato','dado'],a:'pato'},
{p:'QUAL COMEÇA COM D?',type:'pics',o:['maca','dado','mesa'],a:'dado'},
{p:'MONTE A PALAVRA',type:'build',word:'BOLA',pic:'bola',o:['B','O','L','A','M','S']},
{p:'MONTE A PALAVRA',type:'build',word:'GATO',pic:'gato',o:['G','A','T','O','P','E']},
{p:'MONTE A PALAVRA',type:'build',word:'CASA',pic:'casa',o:['C','A','S','A','M','O']},
{p:'MONTE A PALAVRA',type:'build',word:'PATO',pic:'pato',o:['P','A','T','O','B','I']},
{p:'MONTE A PALAVRA',type:'build',word:'SAPO',pic:'sapo',o:['S','A','P','O','C','U']}
];
function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}
$('#startBtn').onclick=()=>{let n=$('#student').value.trim();if(!n){$('#warn').style.display='block';return}$('#warn').style.display='none';$('#player').textContent=n.toUpperCase();$('#avatar').innerHTML=person(avatar);idx=0;score=0;$('#score').textContent=0;show('game');phaseTransition(0,render);startMusic()}
$('#home').onclick=()=>{stopMusic();show('start')};$('#again').onclick=()=>show('start');$('#music').onclick=()=>{musicOn=!musicOn;$('#music').textContent=musicOn?'🔊':'🔇';musicOn?startMusic():stopMusic()}
function startMusic(){if(audio||!musicOn)return;try{audio=new(window.AudioContext||window.webkitAudioContext)();let g=audio.createGain();g.gain.value=.016;g.connect(audio.destination);let n=[261,329,392,523,392,349,329,293],t=audio.currentTime;for(let i=0;i<220;i++){let o=audio.createOscillator();o.type='triangle';o.frequency.value=n[i%8];o.connect(g);o.start(t+i*.3);o.stop(t+i*.3+.2)}}catch(e){}}
function stopMusic(){if(audio){try{audio.close()}catch(e){}audio=null}}
function pop(ok,t){let f=$('#fb');f.textContent=t;f.classList.add('show');if(ok)conf();setTimeout(()=>f.classList.remove('show'),600)}
function conf(){let c=['#ff5c4b','#ffd43c','#50cf63','#50bfff','#ad72ec'];for(let i=0;i<30;i++){let x=document.createElement('i');x.className='conf';x.style.left=Math.random()*100+'%';x.style.background=c[i%5];x.style.animationDelay=Math.random()*.25+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}}
function correct(){score++;$('#score').textContent=score;pop(1,'⭐ MUITO BEM!');setTimeout(()=>{idx++;$('#bar').style.width=(idx/25*100)+'%';if(idx>=25){stopMusic();$('#winner').textContent=$('#student').value.trim().toUpperCase();show('finish');conf()}else if(idx%5===0){phaseTransition(Math.floor(idx/5),render)}else render()},700)}
function wrong(){pop(0,'💛 TENTE OUTRA!')}
function photo(k,label,handler){let b=document.createElement('button');b.className='photo';b.innerHTML=art[k]+`<span>${label||''}</span>`;b.onclick=handler;return b}
function association(q){
 let map={A:'maca',B:'bola',G:'gato',C:'casa',P:'pato',S:'sapo',D:'dado',M:'macaco'};
 let kind=q.pic||map[q.t]||(q.o&&q.o.find(x=>art[x]))||null;
 if(!kind&&q.word)kind={BOLA:'bola',GATO:'gato',CASA:'casa',PATO:'pato',SAPO:'sapo'}[q.word];
 if(!kind)return '';
 let txt=q.t||q.a||q.word||'';
 return `<div class="assoc"><div class="photo">${art[kind]}</div><div class="assocMark">↔</div><div class="assocText">${txt}</div></div>`;
}
function phaseTransition(phase,cb){
 $('#transitionTitle').textContent=`FASE ${phase+1} • ${phases[phase]}`;
 let h=''; phases.forEach((x,i)=>h+=`<div class="phasecard ${i===phase?'active':''} ${i<phase?'done':''}"><b>${i+1}</b><span>${x}</span></div>`);
 $('#phasecards').innerHTML=h; $('#transition').classList.add('show');
 $('#continuePhase').onclick=()=>{$('#transition').classList.remove('show');cb()}
}
function render(){let q=A[idx],phase=Math.floor(idx/5),within=idx%5+1;$('#counter').textContent=`${idx+1}/25`;$('#stage').innerHTML=`<div class="head"><span class="worldtag">FASE ${phase+1} • ${phases[phase]} • ATIVIDADE ${within}/5</span>${q.p}${q.t?` <span class="target">${q.t}</span>`:''}</div><section class="card"><div id="body"></div></section>`;let body=$('#body');body.insertAdjacentHTML('beforeend',association(q));
if(q.type==='letters'||q.type==='syll'){let d=document.createElement('div');d.className='options';q.o.forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>v===q.a?correct():wrong();d.appendChild(b)});body.appendChild(d)}
if(q.type==='pics'){let d=document.createElement('div');d.className='options';q.o.forEach(v=>d.appendChild(photo(v,v.toUpperCase(),()=>v===q.a?correct():wrong())));body.appendChild(d)}
if(q.type==='fill'){let slots=document.createElement('div');slots.className='slots';let blank=q.mask.indexOf('_');q.mask.split('').forEach(ch=>{let s=document.createElement('div');s.className='slot';s.textContent=ch==='_'?'':ch;slots.appendChild(s)});body.appendChild(slots);let d=document.createElement('div');d.className='options';q.o.forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{if(v===q.a){slots.children[blank].textContent=v;correct()}else wrong()};d.appendChild(b)});body.appendChild(d)}
if(q.type==='build'){let slots=document.createElement('div');slots.className='slots';q.word.split('').forEach(()=>{let s=document.createElement('div');s.className='slot';slots.appendChild(s)});body.appendChild(slots);let d=document.createElement('div');d.className='options';let pos=0;q.o.forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{if(v===q.word[pos]){slots.children[pos].textContent=v;pos++;b.disabled=true;b.style.opacity=.4;pop(1,'⭐');if(pos===q.word.length)setTimeout(correct,450)}else wrong()};d.appendChild(b)});body.appendChild(d)}
}
</script></body></html>
